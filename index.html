'use strict';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isHex = s => /^#[0-9a-f]{6}$/i.test(String(s || ''));
const safeHex = (s, fallback = '#000000') => isHex(s) ? s : fallback;

/* ============ FFmpeg lazy ============ */
let ffmpeg = null, ffmpegLoaded = false, ffmpegLoading = null;
async function initFFmpeg() {
  if (ffmpegLoaded) return true;
  if (ffmpegLoading) return ffmpegLoading;
  ffmpegLoading = (async () => {
    try {
      $('progressStage').textContent = 'Загрузка FFmpeg (25 МБ)…';
      const { FFmpeg } = window.FFmpegWASM;
      ffmpeg = new FFmpeg();
      ffmpeg.on('log', ({ message }) => {
        const s = $('progressStage');
        if (s) s.textContent = message.substring(0, 90);
      });
      await ffmpeg.load({
        coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
        wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
      });
      ffmpegLoaded = true;
      ffmpegLoading = null;
      return true;
    } catch (e) {
      console.error('FFmpeg:', e);
      ffmpegLoading = null;
      return false;
    }
  })();
  return ffmpegLoading;
}

/* ============ FILESYSTEM ============ */
const FS = {
  dirHandle: null, _pendingHandle: null,
  hasFS: typeof window.showDirectoryPicker === 'function',
  async openFolder() {
    if (!this.hasFS) { toast('Нужен Chrome/Edge/Opera', 'warn'); return false; }
    try {
      this.dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      await this.getOrCreateDir('media');
      await this.getOrCreateDir('projects');
      await this.getOrCreateDir('exports');
      await this.saveHandle().catch(() => {});
      $('launcherFolderLabel').textContent = 'Папка:';
      $('launcherFolderName').textContent = this.dirHandle.name;
      $('restoreBanner').classList.remove('show');
      toast(`Папка: ${this.dirHandle.name}`, 'ok');
      return true;
    } catch (err) {
      if (err.name !== 'AbortError') toast('Ошибка: ' + err.message, 'err');
      return false;
    }
  },
  async saveHandle() {
    if (!this.dirHandle) return;
    const db = await this.openDB();
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(this.dirHandle, 'folder');
    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
  },
  async restoreHandle() {
    if (!this.hasFS) return false;
    try {
      const db = await this.openDB();
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get('folder');
      const handle = await new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = rej; });
      if (!handle) return false;
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        this.dirHandle = handle;
        $('launcherFolderLabel').textContent = 'Папка:';
        $('launcherFolderName').textContent = handle.name;
        return true;
      }
      if (perm === 'prompt') this._pendingHandle = handle;
    } catch (e) {}
    return false;
  },
  async requestPendingAccess() {
    if (!this._pendingHandle) return false;
    try {
      const r = await this._pendingHandle.requestPermission({ mode: 'readwrite' });
      if (r === 'granted') {
        this.dirHandle = this._pendingHandle;
        $('launcherFolderLabel').textContent = 'Папка:';
        $('launcherFolderName').textContent = this.dirHandle.name;
        $('restoreBanner').classList.remove('show');
        return true;
      }
    } catch (e) {}
    return false;
  },
  async openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('procut_fs', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  },
  async getOrCreateDir(name) {
    if (!this.dirHandle) return null;
    return await this.dirHandle.getDirectoryHandle(name, { create: true });
  },
  async writeFile(subdir, filename, blob) {
    if (!this.dirHandle) throw new Error('Папка не открыта');
    const dir = await this.getOrCreateDir(subdir);
    const fileHandle = await dir.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
  },
  async readFile(subdir, filename) {
    if (!this.dirHandle) throw new Error('Папка не открыта');
    const dir = await this.getOrCreateDir(subdir);
    const fileHandle = await dir.getFileHandle(filename);
    return await fileHandle.getFile();
  },
  async listFiles(subdir) {
    if (!this.dirHandle) return [];
    const dir = await this.getOrCreateDir(subdir);
    const files = [];
    for await (const entry of dir.values()) if (entry.kind === 'file') files.push({ name: entry.name, handle: entry });
    return files;
  },
  async deleteFile(subdir, filename) {
    if (!this.dirHandle) return;
    try { const dir = await this.getOrCreateDir(subdir); await dir.removeEntry(filename); } catch (e) {}
  },
  async saveMediaToDisk(mediaId, file) {
    const safeName = mediaId + '_' + file.name.replace(/[^\w.-]/g, '_');
    await this.writeFile('media', safeName, file);
    return safeName;
  },
  async saveProjectToDisk(project) {
    const json = JSON.stringify(project, null, 2);
    await this.writeFile('projects', project.id + '.json', new Blob([json], { type: 'application/json' }));
    await this.writeFile('projects', '_last.txt', new Blob([project.id], { type: 'text/plain' }));
  },
  async loadProjectFromDisk(projectId) {
    const file = await this.readFile('projects', projectId + '.json');
    return JSON.parse(await file.text());
  },
  async listProjects() {
    const files = await this.listFiles('projects');
    const projects = [];
    const json = files.filter(f => f.name.endsWith('.json'));
    // Параллельно с ограничением
    for (const f of json) {
      try {
        const file = await f.handle.getFile();
        projects.push(JSON.parse(await file.text()));
      } catch (e) {}
    }
    return projects;
  }
};

const LS = {
  save(project) {
    try {
      const saved = JSON.parse(localStorage.getItem('procut_projects') || '[]');
      const idx = saved.findIndex(p => p.id === project.id);
      if (idx >= 0) saved[idx] = project; else saved.unshift(project);
      localStorage.setItem('procut_projects', JSON.stringify(saved.slice(0, 50)));
    } catch (e) {}
  },
  getAll() { try { return JSON.parse(localStorage.getItem('procut_projects') || '[]'); } catch (e) { return []; } },
  get(id) { return this.getAll().find(p => p.id === id); },
  delete(id) { try { localStorage.setItem('procut_projects', JSON.stringify(this.getAll().filter(p => p.id !== id))); } catch (e) {} }
};

/* ============ SFX Player ============ */
const SFXPlayer = {
  ctx: null, master: null, active: new Set(),
  ensure() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.85;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  stopAll() {
    this.active.forEach(item => {
      try { item.node.stop(); } catch (e) {}
      try { item.node.disconnect(); } catch (e) {}
      if (item.timer) clearTimeout(item.timer);
    });
    this.active.clear();
    document.querySelectorAll('.sfx-item .play-ico').forEach(b => b.textContent = '▶');
  },
  _register(node, dur, onEnd, gain) {
    if (gain !== undefined && this.ctx) {
      try {
        const g = this.ctx.createGain();
        g.gain.value = gain;
        // node уже подключён к master; переподключаем через gain
        try { node.disconnect(); } catch (e) {}
        node.connect(g).connect(this.master);
      } catch (e) {}
    }
    const item = { node, timer: null };
    this.active.add(item);
    node.onended = () => {
      this.active.delete(item);
      try { node.disconnect(); } catch (e) {}
      if (onEnd) onEnd();
    };
    item.timer = setTimeout(() => {
      if (this.active.has(item)) {
        try { node.stop(); } catch (e) {}
        this.active.delete(item);
        if (onEnd) onEnd();
      }
    }, dur * 1000 + 300);
  },
  _synth(id) {
    const ctx = this.ctx, now = ctx.currentTime, out = this.master;
    const osc = (t, f) => { const o = ctx.createOscillator(); o.type = t; o.frequency.value = f; return o; };
    const gain = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const filt = (t, f, q) => { const b = ctx.createBiquadFilter(); b.type = t; b.frequency.value = f; if (q !== undefined) b.Q.value = q; return b; };
    const noiseBuf = (dur) => { const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };

    if (id === 'click') { const dur = 0.08; const o = osc('square', 1200); const g = gain(0.5); o.frequency.exponentialRampToValueAtTime(400, now + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'pop') { const dur = 0.15; const o = osc('sine', 600); const g = gain(0.6); o.frequency.exponentialRampToValueAtTime(1400, now + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'whoosh') { const dur = 0.6; const o = osc('sawtooth', 80); const f = filt('bandpass', 800, 2); const g = gain(0.0001); o.frequency.exponentialRampToValueAtTime(2400, now + dur); g.gain.linearRampToValueAtTime(0.6, now + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(f).connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'swoosh') { const dur = 0.4; const src = ctx.createBufferSource(); src.buffer = noiseBuf(dur); const f = filt('highpass', 1000); const g = gain(0.5); src.connect(f).connect(g).connect(out); src.start(now); return { node: src, dur }; }
    if (id === 'riser') { const dur = 2; const o = osc('sawtooth', 100); const f = filt('bandpass', 200, 3); const g = gain(0.0001); f.frequency.exponentialRampToValueAtTime(4000, now + dur); o.frequency.exponentialRampToValueAtTime(800, now + dur); g.gain.linearRampToValueAtTime(0.4, now + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(f).connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'impact') { const dur = 0.5; const o = osc('sawtooth', 120); const f = filt('lowpass', 500); const g = gain(0.8); o.frequency.exponentialRampToValueAtTime(40, now + 0.4); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(f).connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'glitch') { const dur = 0.32; const parent = gain(1); parent.connect(out); const sources = []; for (let i = 0; i < 6; i++) { const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'square'; o.frequency.value = 200 + Math.random() * 2000; const t = now + i * 0.05; g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04); o.connect(g).connect(parent); o.start(t); o.stop(t + 0.04); sources.push(o); } const stopper = { stop: () => sources.forEach(s => { try { s.stop(); } catch (e) {} }), disconnect: () => { try { parent.disconnect(); } catch (e) {} }, onended: null }; return { node: stopper, dur }; }
    if (id === 'ding') { const dur = 1; const o = osc('sine', 1200); const g = gain(0.4); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'beep') { const dur = 0.1; const o = osc('sine', 880); const g = gain(0.3); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'coin') { const dur = 0.4; const o1 = osc('square', 988); const o2 = osc('square', 1319); const g1 = gain(0.3); const g2 = gain(0.3); o1.connect(g1).connect(out); o2.connect(g2).connect(out); o1.start(now); o1.stop(now + 0.08); o2.start(now + 0.08); o2.stop(now + dur); g2.gain.setValueAtTime(0.3, now + 0.08); g2.gain.exponentialRampToValueAtTime(0.0001, now + dur); return { node: o2, dur }; }
    if (id === 'jump') { const dur = 0.3; const o = osc('sine', 400); const g = gain(0.5); o.frequency.exponentialRampToValueAtTime(800, now + dur); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'powerup') { const dur = 0.6; const o = osc('square', 200); const g = gain(0.3); o.frequency.exponentialRampToValueAtTime(2000, now + dur); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'laser') { const dur = 0.25; const o = osc('sawtooth', 2000); const g = gain(0.4); o.frequency.exponentialRampToValueAtTime(200, now + dur); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'punch') { const dur = 0.3; const o = osc('sine', 150); const g = gain(0.9); o.frequency.exponentialRampToValueAtTime(50, now + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'cheer') { const dur = 2; const src = ctx.createBufferSource(); src.buffer = noiseBuf(dur); const f = filt('bandpass', 2000, 1); const g = gain(0.4); src.connect(f).connect(g).connect(out); src.start(now); return { node: src, dur }; }
    if (id === 'tada') { const dur = 1.2; const parent = gain(1); parent.connect(out); const oscs = []; [523, 659, 784, 1047].forEach((f, i) => { const o = osc('triangle', f); const g = gain(0); const t = now + i * 0.08; g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur - i * 0.08); o.connect(g).connect(parent); o.start(t); o.stop(t + dur - i * 0.08); oscs.push(o); }); const stopper = { stop: () => oscs.forEach(o => { try { o.stop(); } catch (e) {} }), disconnect: () => { try { parent.disconnect(); } catch (e) {} }, onended: null }; return { node: stopper, dur }; }
    if (id === 'wobble') { const dur = 0.5; const o = osc('sine', 400); const g = gain(0.4); const lfo = osc('sine', 15); const lfoG = gain(80); lfo.connect(lfoG).connect(o.frequency); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); lfo.start(now); lfo.stop(now + dur); return { node: o, dur }; }
    if (id === 'boing') { const dur = 0.5; const o = osc('sine', 800); const g = gain(0.4); o.frequency.exponentialRampToValueAtTime(200, now + dur); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'heartbeat') { const dur = 1.2; const parent = gain(1); parent.connect(out); const oscs = []; [0, 0.15].forEach((t) => { const o = osc('sine', 60); const g = gain(0); g.gain.setValueAtTime(0.001, now + t); g.gain.linearRampToValueAtTime(0.8, now + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.2); o.connect(g).connect(parent); o.start(now + t); o.stop(now + t + 0.2); oscs.push(o); }); const stopper = { stop: () => oscs.forEach(o => { try { o.stop(); } catch (e) {} }), disconnect: () => { try { parent.disconnect(); } catch (e) {} }, onended: null }; return { node: stopper, dur }; }
    if (id === 'typing') { const dur = 0.8; const parent = gain(1); parent.connect(out); const oscs = []; for (let i = 0; i < 12; i++) { const o = osc('square', 800 + Math.random() * 400); const g = gain(0.2); const t = now + i * 0.06; g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03); o.connect(g).connect(parent); o.start(t); o.stop(t + 0.03); oscs.push(o); } const stopper = { stop: () => oscs.forEach(o => { try { o.stop(); } catch (e) {} }), disconnect: () => { try { parent.disconnect(); } catch (e) {} }, onended: null }; return { node: stopper, dur }; }
    if (id === 'notification') { const dur = 0.6; const parent = gain(1); parent.connect(out); const oscs = []; [880, 1320].forEach((f, i) => { const o = osc('sine', f); const g = gain(0.3); const t = now + i * 0.1; g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g).connect(parent); o.start(t); o.stop(t + 0.3); oscs.push(o); }); const stopper = { stop: () => oscs.forEach(o => { try { o.stop(); } catch (e) {} }), disconnect: () => { try { parent.disconnect(); } catch (e) {} }, onended: null }; return { node: stopper, dur }; }
    if (id === 'error') { const dur = 0.4; const o = osc('square', 220); const g = gain(0.3); o.frequency.exponentialRampToValueAtTime(110, now + dur); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o.connect(g).connect(out); o.start(now); o.stop(now + dur); return { node: o, dur }; }
    if (id === 'success') { const dur = 0.6; const parent = gain(1); parent.connect(out); const oscs = []; [523, 659, 784].forEach((f, i) => { const o = osc('sine', f); const g = gain(0); const t = now + i * 0.1; g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g).connect(parent); o.start(t); o.stop(t + 0.3); oscs.push(o); }); const stopper = { stop: () => oscs.forEach(o => { try { o.stop(); } catch (e) {} }), disconnect: () => { try { parent.disconnect(); } catch (e) {} }, onended: null }; return { node: stopper, dur }; }
    if (id === 'bell') { const dur = 1.5; const o1 = osc('sine', 800); const o2 = osc('sine', 1600); const o3 = osc('sine', 2400); const g = gain(0.3); o1.connect(g); o2.connect(g); o3.connect(g); g.connect(out); g.gain.exponentialRampToValueAtTime(0.0001, now + dur); o1.start(now); o1.stop(now + dur); o2.start(now); o2.stop(now + dur); o3.start(now); o3.stop(now + dur); return { node: o1, dur }; }
    return null;
  },
  play(id, onEnd, volume) {
    this.ensure();
    this.stopAll();
    const res = this._synth(id);
    if (!res) return null;
    this._register(res.node, res.dur, onEnd, volume !== undefined ? clamp(volume, 0, 2) : undefined);
    return res;
  }
};
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => SFXPlayer.ensure(), { once: true, capture: true }));

/* ============ UTILS ============ */
function fmt(t) { if (!isFinite(t) || t < 0) t = 0; const m = Math.floor(t / 60); const s = Math.floor(t % 60); const cs = Math.floor((t - Math.floor(t)) * 100); return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`; }
function parseTime(str) { if (!str) return 0; const p = String(str).replace(',', '.').split(':'); let v; if (p.length === 3) v = +p[0] * 3600 + +p[1] * 60 + +p[2]; else if (p.length === 2) v = +p[0] * 60 + +p[1]; else v = +str; return isFinite(v) ? v : 0; }
function toast(msg, kind = '') { const el = $('toast'); el.textContent = msg; el.className = 'toast show ' + kind; clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2800); }
function setStatus(s) { $('statBadge').textContent = s; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function markUnsaved() { State.unsavedChanges = true; $('saveIndicator').classList.add('show'); }
function markSaved() { State.unsavedChanges = false; $('saveIndicator').classList.remove('show'); }

function snapshot() {
  State.history = State.history.slice(0, State.historyIdx + 1);
  State.history.push(JSON.stringify({ clips: State.clips, selectedId: State.selectedId, playhead: State.playhead }));
  State.historyIdx = State.history.length - 1;
  if (State.history.length > 60) { State.history.shift(); State.historyIdx--; }
  markUnsaved();
}
function undo() {
  if (State.historyIdx <= 0) return;
  State.historyIdx--;
  const s = JSON.parse(State.history[State.historyIdx]);
  State.clips = s.clips;
  State.selectedId = s.selectedId;
  State.selectedIds = [];
  State.playhead = s.playhead || 0;
  renderAll();
  toast('Отменено');
}

/* ============ CLIP INDEX ============ */
function rebuildClipIndex() {
  const idx = new Map();
  for (const c of State.clips) {
    if (!idx.has(c.track)) idx.set(c.track, []);
    idx.get(c.track).push(c);
  }
  State._clipIndex = idx;
}
function clipsByTrack(track) { return State._clipIndex.get(track) || []; }

/* ============ MEDIA ============ */
async function importFiles(files, onProgress, defaultTrack = null) {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:absolute;bottom:0;left:0;height:2px;background:var(--acc);width:0%;transition:width .2s';
  $('previewStage').appendChild(bar);
  let count = 0, total = files.length;
  for (const file of files) {
    const isVideo = file.type.startsWith('video/');
    const isAudio = file.type.startsWith('audio/');
    const isImage = file.type.startsWith('image/');
    if (!isVideo && !isAudio && !isImage) continue;
    count++;
    bar.style.width = (count / total * 100) + '%';
    if (onProgress) onProgress(count, total);
    setStatus(`Загрузка ${count}/${total}`);

    const url = URL.createObjectURL(file);
    const el = isVideo || isAudio ? document.createElement(isVideo ? 'video' : 'audio') : new Image();
    el.src = url;
    el.preload = 'metadata';
    el.crossOrigin = 'anonymous';
    try {
      await Promise.race([
        new Promise((res, rej) => { if (isImage) { el.onload = res; el.onerror = rej; } else { el.onloadedmetadata = res; el.onerror = rej; } }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))
      ]);
    } catch (e) {
      URL.revokeObjectURL(url);
      toast(`Не удалось загрузить: ${file.name}`, 'warn');
      continue;
    }

    let thumb = '', duration = isImage ? 5 : (el.duration || 0);
    let width = el.videoWidth || el.naturalWidth || 0;
    let height = el.videoHeight || el.naturalHeight || 0;
    if (isVideo) {
      try { thumb = await Promise.race([makeVideoThumb(el), new Promise(res => setTimeout(() => res(''), 3000))]); } catch (e) { thumb = ''; }
    } else if (isImage) { thumb = url; }

    const mediaId = uid();
    const m = {
      id: mediaId, type: isVideo ? 'video' : isAudio ? 'audio' : 'image',
      name: file.name, file, url, duration, width, height, thumb, el,
      diskName: null,
      defaultTrack: defaultTrack || (isAudio ? 'audio' : null),
      missing: false
    };
    State.media.push(m);

    if (FS.dirHandle) {
      try {
        const diskName = await Promise.race([
          FS.saveMediaToDisk(mediaId, file),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000))
        ]);
        m.diskName = diskName;
      } catch (e) {}
    }
  }
  bar.remove();
  renderMedia();
  setStatus('Готов');
  toast(`Импортировано: ${count}`, 'ok');
  markUnsaved();
}

function makeVideoThumb(video) {
  return new Promise((resolve) => {
    const c = document.createElement('canvas');
    c.width = 160; c.height = 90;
    const ctx = c.getContext('2d');
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      try { ctx.drawImage(video, 0, 0, c.width, c.height); } catch (e) {}
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    const target = Math.min(1, (video.duration || 2) / 2);
    if (video.readyState >= 2) {
      video.currentTime = target;
      video.addEventListener('seeked', finish, { once: true });
      setTimeout(finish, 1000);
    } else setTimeout(finish, 400);
  });
}

function renderMedia() {
  $('mediaCount').textContent = State.media.length;
  const list = $('mediaList');
  list.innerHTML = '';
  State.media.forEach(m => {
    const div = document.createElement('div');
    div.className = 'media-item';
    let visual = '';
    if (m.missing) {
      visual = `<div class="no-thumb" style="background:linear-gradient(135deg,#7a1a1a,#5a1212)">⚠</div>`;
    } else if (m.type === 'image' || (m.type === 'video' && m.thumb)) {
      visual = `<img src="${m.thumb || ''}" alt="">`;
    } else if (m.type === 'audio') {
      const icon = m.defaultTrack === 'music' ? '🎵' : '🎤';
      visual = `<div class="no-thumb" style="background:linear-gradient(135deg,#7a5a1e,#5a4316)">${icon}</div>`;
    } else {
      visual = `<div class="no-thumb">🎬</div>`;
    }
    const typeLabel = m.missing
      ? '⚠ потерян'
      : (m.type === 'audio' ? (m.defaultTrack === 'music' ? '🎵 Музыка' : '🎤 Аудио') : m.type);
    div.innerHTML = `${visual}<div class="meta"><div class="name">${escapeHtml(m.name)}</div><div class="info">${m.duration ? fmt(m.duration) : '—'} • ${typeLabel}</div></div><button class="add" title="Добавить">+</button><button class="del" title="Удалить">×</button>`;
    div.querySelector('.add').onclick = e => { e.stopPropagation(); addClipFromMedia(m); };
    div.querySelector('.del').onclick = e => {
      e.stopPropagation();
      if (!confirm(`Удалить "${m.name}" из медиатеки?`)) return;
      const used = State.clips.some(c => c.mediaId === m.id);
      if (used && !confirm('Видео используется в монтаже. Продолжить?')) return;
      State.media = State.media.filter(x => x.id !== m.id);
      URL.revokeObjectURL(m.url);
      renderMedia();
      markUnsaved();
    };
    div.ondblclick = () => addClipFromMedia(m);
    list.appendChild(div);
  });
}

function addClipFromMedia(media, opts = {}) {
  let track = 'video';
  if (media.type === 'audio') track = media.defaultTrack || 'audio';
  if (media.type === 'image') track = 'video';
  if (opts.music) track = 'music';
  const dur = media.duration || 5;
  const trackClips = clipsByTrack(track);
  let start = opts.start;
  if (start === undefined) {
    start = 0;
    trackClips.forEach(c => { const end = c.start + getClipDuration(c); if (end > start) start = end; });
  }
  const clip = {
    id: uid(), mediaId: media.id, track, start,
    in: 0, out: dur, speed: 1, volume: 1,
    name: opts.name || media.name.replace(/\.[^.]+$/, ''),
    type: media.type,
    fx: { brightness: 100, contrast: 100, saturate: 100, hue: 0, blur: 0, sepia: 0, opacity: 100, grayscale: 0, invert: 0 },
    fadeIn: 0, fadeOut: 0, transIn: null, transOut: null,
    title: opts.title || null, sfx: null, loop: false
  };
  State.clips.push(clip);
  State.selectedId = clip.id;
  State.selectedIds = [clip.id];
  snapshot();
  rebuildClipIndex();
  renderAll();
  toast(`Добавлено: ${clip.name}`, 'ok');
}

function getClipDuration(c) { return (c.out - c.in) / c.speed; }
function getMedia(id) { return State.media.find(m => m.id === id); }
function getSelectedClip() { return State.clips.find(c => c.id === State.selectedId); }
function getSelectedClips() { return State.clips.filter(c => State.selectedIds.includes(c.id)); }
function getTimelineDuration() {
  let max = 0;
  State.clips.forEach(c => { const end = c.start + getClipDuration(c); if (end > max) max = end; });
  return max;
}

  const el = $('stickerCategories');

    const header = document.createElement('div');
    header.className = 'sticker-cat';
    header.innerHTML = `<span>${cat.icon} ${cat.name}</span><span class="arrow">▼</span>`;

    };
    el.appendChild(header);
    el.appendChild(items);
  });

/* ============ FX TRACK ============ */
function addFxToTimeline(fxId, opts = {}) {
  const def = getFxDef(fxId);
  if (!def) return;
  const params = {};
  if (def.params) for (const k in def.params) params[k] = def.params[k].default;
  const clip = {
    id: uid(), mediaId: null, track: 'fx',
    start: opts.start ?? State.playhead, in: 0, out: def.dur, speed: 1, volume: 1,
    name: def.name, type: 'fx', fxId, target: 'video', params,
    fx: { brightness: 100, contrast: 100, saturate: 100, hue: 0, blur: 0, sepia: 0, opacity: 100, grayscale: 0, invert: 0 },
    fadeIn: 0, fadeOut: 0, transIn: null, transOut: null, title: null, sfx: null
  };
  State.clips.push(clip);
  State.selectedId = clip.id;
  State.selectedIds = [clip.id];
  snapshot();
  rebuildClipIndex();
  renderAll();
  toast(`⚡ ${def.name}`, 'ok');
}

function getActiveFxAt(time) {
  return clipsByTrack('fx')
    .filter(c => time >= c.start && time < c.start + getClipDuration(c) && (c.target === 'video' || c.target === 'all'))
    .map(c => ({ id: c.fxId, p: (time - c.start) / getClipDuration(c), params: c.params || {} }));
}

function computeFxStack(fxList) {
  const out = { x: 0, y: 0, scale: 1, flipX: false, alpha: 1, rotation: 0, extraFilter: '' };
  if (!fxList || !fxList.length) return out;
  for (const fx of fxList) {
    if (isParticleFx(fx.id)) continue;
    const p = fx.p, par = fx.params || {};
    const fade = p < 0.7 ? 1 : (1 - (p - 0.7) / 0.3);
    switch (fx.id) {
      case 'glitch': { const I = (par.intensity ?? 50) / 100; out.extraFilter += ` hue-rotate(${Math.sin(p * 60) * 90}deg) saturate(${1 + p * 2})`; out.x += (Math.random() - 0.5) * 30 * fade * I; break; }
      case 'rgbSplit': { const off = (par.offset ?? 20) * fade; out.x += Math.sin(p * Math.PI) * off; break; }
      case 'pixelate': break;
      case 'noise': break;
      case 'flash': { const b = par.brightness ?? 300; out.alpha *= 1 - p * 0.6; out.extraFilter += ` brightness(${100 + (b - 100) * (1 - p)}%)`; break; }
      case 'flashWhite': { out.alpha *= 1 - p * 0.5; break; }
      case 'flashColor': { out.alpha *= 1 - p * 0.5; break; }
      case 'bloom': { out.extraFilter += ` brightness(${100 + 50 * Math.sin(p * Math.PI)}%)`; break; }
      case 'shake': { const a = par.amount ?? 15; out.x += (Math.random() - 0.5) * a * 2 * fade; out.y += (Math.random() - 0.5) * a * 2 * fade; break; }
      case 'spin': { out.rotation += p * Math.PI * 2 * (par.turns ?? 1); break; }
      case 'zoomPunch': { const s = par.scale ?? 1.4; out.scale *= 1 + (s - 1) * Math.sin(p * Math.PI); break; }
      case 'blurFx': { out.extraFilter += ` blur(${Math.sin(p * Math.PI) * (par.amount ?? 8)}px)`; break; }
      case 'motionBlur': { out.extraFilter += ` blur(${Math.sin(p * Math.PI) * (par.amount ?? 20) * 0.5}px)`; break; }
      case 'invert': { out.extraFilter += ` invert(${Math.round(100 * Math.sin(p * Math.PI))}%)`; break; }
      case 'grayscale': { out.extraFilter += ` grayscale(${Math.round(100 * Math.sin(p * Math.PI))}%)`; break; }
      case 'sepiaFx': { out.extraFilter += ` sepia(${Math.round(100 * Math.sin(p * Math.PI))}%)`; break; }
      case 'hueShift': { out.extraFilter += ` hue-rotate(${Math.sin(p * Math.PI) * (par.degrees ?? 180)}deg)`; break; }
      case 'vignette': break;
      case 'mirror': { out.flipX = !out.flipX; break; }
      case 'kaleidoscope': break;
    }
  }
  return out;
}

/* ============ CANVAS + VIDEO ============ */
let video = $('previewVideo');
const canvas = $('overlayCanvas');
const ctx = canvas.getContext('2d', { alpha: true, willReadFrequently: false });

video.addEventListener('loadedmetadata', () => { video.style.display = 'block'; });

function ensureCanvasSize() {
  if (canvas.width !== State.projectW || canvas.height !== State.projectH) {
    canvas.width = State.projectW;
    canvas.height = State.projectH;
  }
}

function getActiveVideoClip(time) {
  return clipsByTrack('video')
    .filter(c => time >= c.start && time < c.start + getClipDuration(c))
    .sort((a, b) => b.start - a.start)[0];
}

function drawOverlayFX(time) {
  ensureCanvasSize();
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const active = getActiveVideoClip(time);
  const activeFx = getActiveFxAt(time);
  const fxT = computeFxStack(activeFx);

  if (active && video && video.parentElement === $('previewStage')) {
    const fx = active.fx;
    const scale = fxT.scale || 1;
    const rotation = fxT.rotation || 0;
    const tx = fxT.x || 0;
    const ty = fxT.y || 0;
    const sx = fxT.flipX ? -scale : scale;
    let cssFilter = '';
    if (fx) {
      const parts = [];
      if (fx.brightness !== 100) parts.push(`brightness(${fx.brightness}%)`);
      if (fx.contrast !== 100) parts.push(`contrast(${fx.contrast}%)`);
      if (fx.saturate !== 100) parts.push(`saturate(${fx.saturate}%)`);
      if (fx.hue !== 0) parts.push(`hue-rotate(${fx.hue}deg)`);
      if (fx.blur > 0) parts.push(`blur(${fx.blur}px)`);
      if (fx.sepia > 0) parts.push(`sepia(${fx.sepia}%)`);
      if (fx.grayscale > 0) parts.push(`grayscale(${fx.grayscale}%)`);
      if (fx.invert > 0) parts.push(`invert(${fx.invert}%)`);
      cssFilter = parts.join(' ');
    }
    if (fxT.extraFilter) cssFilter += ' ' + fxT.extraFilter;
    video.style.transform = `translate(${tx}px, ${ty}px) scale(${sx}, ${scale}) rotate(${rotation}rad)`;
    video.style.filter = cssFilter || 'none';
    video.style.opacity = fxT.alpha ?? 1;
  }

  const particles = activeFx.filter(f => isParticleFx(f.id));
  if (particles.length > 0) {
    particles.forEach(fx => drawParticleEffect(ctx, fx, W, H, time));
  }

  State.clips.forEach(clip => {
    if (clip.track !== 'video' || !clip.title) return;
    if (time < clip.start || time >= clip.start + getClipDuration(clip)) return;
    const localTime = time - clip.start;
    const clipDur = getClipDuration(clip);
    let alpha = 1;
    if (localTime < 0.3) alpha = localTime / 0.3;
    if (localTime > clipDur - 0.3) alpha = Math.max(0, (clipDur - localTime) / 0.3);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawTitle(ctx, clip, W, H);
    ctx.restore();
  });

  State.clips.forEach(clip => {
    if (clip.track !== 'stickers') return;
    if (time < clip.start || time >= clip.start + getClipDuration(clip)) return;
    const localTime = time - clip.start;
    const clipDur = getClipDuration(clip);
    let alpha = 1;
    if (localTime < 0.3) alpha = localTime / 0.3;
    if (localTime > clipDur - 0.3) alpha = Math.max(0, (clipDur - localTime) / 0.3);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawSticker(ctx, clip, W, H);
    ctx.restore();
  });
}

function drawTitle(targetCtx, clip, W, H) {
  const t = clip.title;
  if (!t) return;
  const x = ((t.x !== undefined ? t.x : 50) / 100) * W;
  const y = ((t.y !== undefined ? t.y : 50) / 100) * H;
  const fontSize = t.size || 64;
  const family = t.font || "'Inter', sans-serif";
  const weight = t.weight || 400;
  const align = t.align || 'center';
  targetCtx.font = `${weight} ${fontSize}px ${family}`;
  targetCtx.textAlign = align;
  targetCtx.textBaseline = 'middle';
  const lines = (t.text || '').split('\n');
  const lineHeight = fontSize * 1.2;
  const totalHeight = lines.length * lineHeight;
  const startY = y - totalHeight / 2 + lineHeight / 2;
  if (t.strokeWidth > 0) {
    targetCtx.strokeStyle = t.strokeColor || '#000';
    targetCtx.lineWidth = t.strokeWidth;
    targetCtx.lineJoin = 'round';
    lines.forEach((line, i) => targetCtx.strokeText(line, x, startY + i * lineHeight));
  }
  if (t.shadow !== false) {
    targetCtx.shadowColor = 'rgba(0,0,0,0.7)';
    targetCtx.shadowBlur = 8;
    targetCtx.shadowOffsetX = 2;
    targetCtx.shadowOffsetY = 2;
  }
  targetCtx.fillStyle = t.color || '#fff';
  lines.forEach((line, i) => targetCtx.fillText(line, x, startY + i * lineHeight));
}

function drawSticker(targetCtx, clip, W, H) {
  const emoji = clip.emoji || '⭐';
  const size = clip.size || 120;
  const x = ((clip.x ?? 50) / 100) * W;
  const y = ((clip.y ?? 50) / 100) * H;
  targetCtx.save();
  targetCtx.font = `${size}px serif`;
  targetCtx.textAlign = 'center';
  targetCtx.textBaseline = 'middle';
  if (clip.rotation) {
    targetCtx.translate(x, y);
    targetCtx.rotate(clip.rotation * Math.PI / 180);
    targetCtx.translate(-x, -y);
  }
  targetCtx.fillText(emoji, x, y);
  targetCtx.restore();
}

function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function drawParticleEffect(targetCtx, fx, W, H, time) {
  const p = fx.p, par = fx.params || {}, t = time;
  const fadeIn = Math.min(1, p * 5), fadeOut = Math.min(1, (1 - p) * 5);
  const intensity = Math.min(fadeIn, fadeOut);
  targetCtx.save();
  targetCtx.globalAlpha = intensity;

  switch (fx.id) {
    case 'snow': {
      const density = par.density ?? 100;
      for (let i = 0; i < density; i++) {
        const r = seededRandom(i * 137 + 7);
        const size = 1 + r() * 4, drift = r() * 2 - 1, s = 30 + r() * 80;
        const y = (r() * H + t * s) % (H + 50) - 25;
        const x = (r() * W + Math.sin(t * 0.5 + i) * drift * 20 + W) % W;
        targetCtx.fillStyle = 'rgba(255,255,255,' + (0.6 + r() * 0.4) + ')';
        targetCtx.beginPath(); targetCtx.arc(x, y, size, 0, Math.PI * 2); targetCtx.fill();
      }
      break;
    }
    case 'rain': {
      const density = par.density ?? 200;
      targetCtx.strokeStyle = 'rgba(180, 200, 255, 0.6)';
      targetCtx.lineWidth = 1.5;
      for (let i = 0; i < density; i++) {
        const r = seededRandom(i * 89 + 3);
        const x = (r() * W + Math.sin(t * 0.3 + i) * 20 + W) % W;
        const y = (r() * H + t * 800) % (H + 40) - 20;
        targetCtx.beginPath(); targetCtx.moveTo(x, y); targetCtx.lineTo(x - 3, y + 15 + r() * 20); targetCtx.stroke();
      }
      break;
    }
    case 'fire': {
      const density = par.density ?? 120;
      for (let i = 0; i < density; i++) {
        const r = seededRandom(i * 211 + 11);
        const size = 4 + r() * 12;
        const offset = (t * 200 + r() * 300) % 400;
        const y = H + 30 - offset;
        const x = r() * W + Math.sin(t * 2 + i) * (20 + r() * 40) - offset * 0.15;
        const life = 1 - offset / 400;
        targetCtx.fillStyle = `hsla(${20 + r() * 30}, 100%, ${50 + life * 40}%, ${Math.max(0, life * 0.8)})`;
        targetCtx.beginPath(); targetCtx.arc(x, y, size * life, 0, Math.PI * 2); targetCtx.fill();
      }
      break;
    }
    case 'leaves': {
      const density = par.density ?? 40;
      for (let i = 0; i < density; i++) {
        const r = seededRandom(i * 173 + 5);
        const size = 6 + r() * 10, s = 40 + r() * 60;
        const y = (r() * H + t * s) % (H + 60) - 30;
        const x = (r() * W + Math.sin(t * 0.8 + i) * 60 + W) % W;
        targetCtx.save();
        targetCtx.translate(x, y);
        targetCtx.rotate(t + i);
        const colors = ['#c97b34', '#a85427', '#d4a373', '#8b5e34'];
        targetCtx.fillStyle = colors[i % 4];
        targetCtx.beginPath(); targetCtx.ellipse(0, 0, size, size * 0.4, 0, 0, Math.PI * 2); targetCtx.fill();
        targetCtx.restore();
      }
      break;
    }
    case 'sparks': {
      const density = par.density ?? 60;
      for (let i = 0; i < density; i++) {
        const r = seededRandom(i * 251 + 17);
        const cycle = 1.5 + r(), phase = ((t * cycle) + r() * 10) % cycle, life = 1 - phase / cycle;
        const x = r() * W, y = H - 50 - r() * H * 0.5;
        const drift = Math.sin(phase * 5 + i) * 30;
        targetCtx.fillStyle = `rgba(255, ${200 + r() * 55}, 100, ${life})`;
        targetCtx.beginPath(); targetCtx.arc(x + drift, y - phase * 40, (2 + r() * 3) * life, 0, Math.PI * 2); targetCtx.fill();
      }
      break;
    }
    case 'confetti': {
      const density = par.density ?? 100;
      for (let i = 0; i < density; i++) {
        const r = seededRandom(i * 311 + 19);
        const size = 4 + r() * 8, s = 200 + r() * 300;
        const y = (r() * H + t * s) % (H + 60) - 30;
        const x = (r() * W + Math.sin(t + i) * 50 + W) % W;
        targetCtx.save();
        targetCtx.translate(x, y);
        targetCtx.rotate(t * 3 + i);
        const colors = ['#ff6b9d', '#ffd93d', '#6bcf7f', '#5b8cff', '#a06bff'];
        targetCtx.fillStyle = colors[i % 5];
        targetCtx.fillRect(-size / 2, -size / 4, size, size / 2);
        targetCtx.restore();
      }
      break;
    }
    case 'stars': {
      const density = par.density ?? 100;
      for (let i = 0; i < density; i++) {
        const r = seededRandom(i * 173 + 29);
        const twinkle = 0.5 + Math.sin(t * 2 + i * 0.5) * 0.5;
        targetCtx.fillStyle = `rgba(255, 255, 255, ${twinkle})`;
        targetCtx.beginPath(); targetCtx.arc(r() * W, r() * H, 0.5 + r() * 2, 0, Math.PI * 2); targetCtx.fill();
      }
      break;
    }
    case 'matrix': {
      const density = par.density ?? 80;
      targetCtx.font = '16px monospace';
      targetCtx.fillStyle = '#0f0';
      for (let i = 0; i < density; i++) {
        const r = seededRandom(i * 977 + 37);
        const x = Math.floor(r() * W / 20) * 20;
        const y = (r() * H + t * (30 + r() * 80)) % (H + 100) - 50;
        const char = String.fromCharCode(0x30A0 + Math.floor(r() * 96));
        targetCtx.globalAlpha = intensity * (0.3 + r() * 0.7);
        targetCtx.fillText(char, x, y);
      }
      break;
    }
  }
  targetCtx.restore();
}

/* ============ PLAYBACK ============ */
let playRaf = null, activeClipRef = null, activeVideoEl = null, lastSfxTime = 0;
let renderGeneration = 0; // токен отмены seek

function prepareActiveVideo(time) {
  const clip = getActiveVideoClip(time);
  const media = clip ? getMedia(clip.mediaId) : null;
  const needsChange = !activeClipRef || activeClipRef.id !== clip?.id;

  if (needsChange) {
    activeClipRef = clip;
    State.media.forEach(m => {
      if (m.el && m.el.pause && m.el !== media?.el) m.el.pause();
    });

    if (clip && media && media.el && media.type === 'video' && !media.missing) {
      const v = media.el;
      if (v.src !== media.url) { v.src = media.url; v.load(); }
      const localTime = (time - clip.start) * clip.speed + clip.in;
      v.currentTime = clamp(localTime, 0, v.duration || 0);
      v.playbackRate = clip.speed;
      v.muted = false;
      v.volume = clamp(clip.volume, 0, 1);
      v.play().catch(e => console.warn('play error:', e));

      if (video !== v) {
        video.style.display = 'none';
        const stage = $('previewStage');
        if (v.parentElement !== stage) {
          v.style.cssText = 'display:block;max-width:100%;max-height:100%;';
          v.setAttribute('playsinline', '');
          v.id = 'previewVideo';
          if (video.parentElement) video.remove();
          stage.insertBefore(v, stage.firstChild);
        }
        activeVideoEl = v;
      } else {
        activeVideoEl = v;
      }
      $('overlayCanvas').style.display = 'block';
      $('previewEmpty').style.display = 'none';
    } else {
      activeVideoEl = null;
    }
  } else if (activeVideoEl && activeVideoEl.paused && State.playing) {
    activeVideoEl.play().catch(() => {});
  }

  // Аудио
  State.media.forEach(m => {
    if (m.type !== 'audio' || !m.el || m.missing) return;
    const activeClips = State.clips.filter(c => c.mediaId === m.id && (c.track === 'audio' || c.track === 'music') && time >= c.start && time < c.start + getClipDuration(c));
    if (activeClips.length === 0) { m.el.pause(); return; }
    const c = activeClips[0];
    let targetTime = (time - c.start) * c.speed + c.in;
    if (c.loop && m.el.duration > 0) targetTime = c.in + ((targetTime - c.in) % Math.max(0.1, m.el.duration - c.in));
    if (Math.abs(m.el.currentTime - targetTime) > 0.4) m.el.currentTime = targetTime;
    m.el.playbackRate = c.speed;
    m.el.volume = clamp(c.volume, 0, 1);
    if (!State.playing) m.el.pause();
    else if (m.el.paused) m.el.play().catch(() => {});
  });
}

async function play() {
  if (State.playing) return;
  const total = getTimelineDuration();
  if (total === 0) return;

  SFXPlayer.ensure();
  State.playing = true;
  $('btnPlay').textContent = '⏸';
  setStatus('Play');

  if (State.playhead >= total - 0.01) State.playhead = 0;
  const startReal = performance.now();
  const startTL = State.playhead;
  lastSfxTime = startTL;
  prepareActiveVideo(State.playhead);

  const loop = () => {
    if (!State.playing) return;
    const now = performance.now();
    const t = startTL + (now - startReal) / 1000;
    if (t >= total) {
      State.playhead = total;
      $('playhead').style.left = (t * State.pixelsPerSec) + 'px';
      updateTimeDisplay();
      drawOverlayFX(t);
      pause();
      return;
    }
    State.playhead = t;
    $('playhead').style.left = (t * State.pixelsPerSec) + 'px';
    updateTimeDisplay();

    const newActive = getActiveVideoClip(t);
    if (!activeClipRef || newActive?.id !== activeClipRef.id) {
      prepareActiveVideo(t);
    } else {
      // Обновляем аудио
      State.media.forEach(m => {
        if (m.type !== 'audio' || !m.el || m.missing) return;
        const activeClips = State.clips.filter(c => c.mediaId === m.id && (c.track === 'audio' || c.track === 'music') && t >= c.start && t < c.start + getClipDuration(c));
        if (activeClips.length === 0) { if (!m.el.paused) m.el.pause(); return; }
        const c = activeClips[0];
        let targetTime = (t - c.start) * c.speed + c.in;
        if (c.loop && m.el.duration > 0) targetTime = c.in + ((targetTime - c.in) % Math.max(0.1, m.el.duration - c.in));
        if (Math.abs(m.el.currentTime - targetTime) > 0.4) m.el.currentTime = targetTime;
        m.el.playbackRate = c.speed;
        m.el.volume = clamp(c.volume, 0, 1);
        if (m.el.paused) m.el.play().catch(() => {});
      });
    }

    checkSfxPlayback(t);
    drawOverlayFX(t);

    const pps = State.pixelsPerSec, scroll = $('tlScroll'), x = t * pps;
    if (x > scroll.scrollLeft + scroll.clientWidth - 80) scroll.scrollLeft = x - scroll.clientWidth * 0.3;
    playRaf = requestAnimationFrame(loop);
  };
  loop();
}

function pause() {
  if (!State.playing) return;
  State.playing = false;
  $('btnPlay').textContent = '▶';
  setStatus('Пауза');
  if (playRaf) cancelAnimationFrame(playRaf);
  State.media.forEach(m => { if (m.el && m.el.pause) m.el.pause(); });
  activeVideoEl = null;
  activeClipRef = null;
  renderPreviewAt(State.playhead);
}

function checkSfxPlayback(time) {
  if (!State.playing) { lastSfxTime = time; return; }
  State.clips.forEach(c => {
    if (c.sfx && c.start >= lastSfxTime && c.start < time) {
      SFXPlayer.play(c.sfx, null, c.volume || 1);
    }
  });
  lastSfxTime = time;
}

function updateTimeDisplay() {
  $('timeCur').textContent = fmt(State.playhead);
  $('timeTotal').textContent = fmt(getTimelineDuration());
}

function seekTo(t) {
  setPlayhead(t);
  const pps = State.pixelsPerSec, scroll = $('tlScroll'), x = State.playhead * pps;
  if (x < scroll.scrollLeft || x > scroll.scrollLeft + scroll.clientWidth - 40) {
    scroll.scrollLeft = Math.max(0, x - scroll.clientWidth / 3);
  }
}

function setPlayhead(t) {
  State.playhead = Math.max(0, t);
  $('playhead').style.left = (State.playhead * State.pixelsPerSec) + 'px';
  updateTimeDisplay();
  if (State.playing) {
    const newActive = getActiveVideoClip(State.playhead);
    if (!activeClipRef || newActive?.id !== activeClipRef.id) {
      prepareActiveVideo(State.playhead);
    }
    drawOverlayFX(State.playhead);
  } else {
    renderPreviewAt(State.playhead);
  }
}

async function renderPreviewAt(time) {
  const gen = ++renderGeneration;
  const active = getActiveVideoClip(time);
  const media = active ? getMedia(active.mediaId) : null;
  ensureCanvasSize();

  const hasAnyContent = State.clips.some(c => {
    if (c.track === 'video' && c.title) return time >= c.start && time < c.start + getClipDuration(c);
    if (c.track === 'stickers') return time >= c.start && time < c.start + getClipDuration(c);
    if (c.track === 'fx') return time >= c.start && time < c.start + getClipDuration(c);
    if (c.track === 'video' && c.mediaId) return time >= c.start && time < c.start + getClipDuration(c);
    return false;
  });

  if (!hasAnyContent) {
    $('overlayCanvas').style.display = 'none';
    $('previewEmpty').style.display = 'block';
    video.style.display = 'none';
    return;
  }

  $('overlayCanvas').style.display = 'block';
  $('previewEmpty').style.display = 'none';

  if (active && media && media.el && !media.missing) {
    const v = media.el;
    if (media.type === 'image') {
      video.style.display = 'none';
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      const sw = v.naturalWidth || v.width;
      const sh = v.naturalHeight || v.height;
      const scale = Math.min(W / sw, H / sh);
      const dw = sw * scale, dh = sh * scale;
      ctx.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh);
      if (gen !== renderGeneration) return;
      drawOverlayFX(time);
    } else {
      video.style.display = 'block';
      if (v.src !== media.url) { v.src = media.url; v.load(); }
      if (v.parentElement !== $('previewStage')) {
        const stage = $('previewStage');
        if ($('previewVideo') && $('previewVideo') !== v) $('previewVideo').remove();
        v.style.cssText = 'display:block;max-width:100%;max-height:100%;';
        v.setAttribute('playsinline', '');
        v.id = 'previewVideo';
        stage.insertBefore(v, stage.firstChild);
        video = v;
      }
      const target = clamp((time - active.start) * active.speed + active.in, 0, v.duration || 0);
      if (Math.abs(v.currentTime - target) > 0.05) {
        await new Promise(res => {
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            v.removeEventListener('seeked', finish);
            res();
          };
          v.addEventListener('seeked', finish);
          v.currentTime = target;
          setTimeout(finish, 500); // safety, но не 150
        });
        if (gen !== renderGeneration) return; // отменено новым seek
      }
      drawOverlayFX(time);
    }
  } else {
    video.style.display = 'none';
    drawOverlayFX(time);
  }
  updateTextOverlay();
}

function refreshPreview() {
  if (State.playing) drawOverlayFX(State.playhead);
  else renderPreviewAt(State.playhead);
}

/* ============ TITLE DRAG ============ */
const textOverlay = document.createElement('div');
textOverlay.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:5';
textOverlay.id = 'textOverlay';
const dragHandle = document.createElement('div');
dragHandle.style.cssText = 'position:absolute;border:2px dashed rgba(91,140,255,.8);background:rgba(91,140,255,.1);border-radius:4px;pointer-events:auto;cursor:move;display:none;z-index:10';
textOverlay.appendChild(dragHandle);
$('previewStage').appendChild(textOverlay);

function getTitlesAt(time) {
  return clipsByTrack('video').filter(c => c.title && time >= c.start && time < c.start + getClipDuration(c));
}

function updateTextOverlay() {
  ensureCanvasSize();
  const titles = getTitlesAt(State.playhead);
  if (titles.length === 0) { dragHandle.style.display = 'none'; return; }
  const clip = titles[0];
  State.selectedTitleClip = clip;
  dragHandle.style.display = 'block';
  const stageRect = $('previewStage').getBoundingClientRect();
  const t = clip.title;
  const x = ((t.x ?? 50) / 100) * stageRect.width;
  const y = ((t.y ?? 50) / 100) * stageRect.height;
  ctx.save();
  ctx.font = `${t.weight || 400} ${t.size || 64}px ${t.font || 'Inter'}`;
  const lines = (t.text || '').split('\n');
  let maxW = 0;
  lines.forEach(l => { const m = ctx.measureText(l); if (m.width > maxW) maxW = m.width; });
  const wCSS = maxW * (stageRect.width / canvas.width);
  const hCSS = (lines.length * (t.size || 64) * 1.2) * (stageRect.height / canvas.height);
  ctx.restore();
  dragHandle.style.width = Math.max(40, wCSS) + 'px';
  dragHandle.style.height = Math.max(20, hCSS) + 'px';
  dragHandle.style.left = (x - Math.max(40, wCSS) / 2) + 'px';
  dragHandle.style.top = (y - Math.max(20, hCSS) / 2) + 'px';
}

dragHandle.addEventListener('mousedown', (e) => {
  if (!State.selectedTitleClip) return;
  e.preventDefault();
  e.stopPropagation();
  const rect = $('previewStage').getBoundingClientRect();
  State.titleDrag = {
    startX: e.clientX, startY: e.clientY,
    origX: State.selectedTitleClip.title.x ?? 50,
    origY: State.selectedTitleClip.title.y ?? 50,
    rect
  };
  document.body.style.cursor = 'move';
});

document.addEventListener('mousemove', (e) => {
  if (!State.titleDrag) return;
  const d = State.titleDrag;
  const pctX = d.origX + ((e.clientX - d.startX) / d.rect.width) * 100;
  const pctY = d.origY + ((e.clientY - d.startY) / d.rect.height) * 100;
  State.selectedTitleClip.title.x = clamp(pctX, 0, 100);
  State.selectedTitleClip.title.y = clamp(pctY, 0, 100);
  refreshPreview();
  updateTextOverlay();
});

document.addEventListener('mouseup', () => {
  if (State.titleDrag) { State.titleDrag = null; document.body.style.cursor = ''; markUnsaved(); }
});

/* ============ TIMELINE (throttled render) ============ */
let tlRenderPending = false;
let tlRenderForce = false;
function scheduleRenderTimeline(force) {
  tlRenderForce = tlRenderForce || !!force;
  if (tlRenderPending) return;
  tlRenderPending = true;
  requestAnimationFrame(() => {
    tlRenderPending = false;
    const f = tlRenderForce;
    tlRenderForce = false;
    renderTimelineNow(f);
  });
}

function renderTimelineNow(force) {
  const pps = State.pixelsPerSec, total = Math.max(getTimelineDuration(), 10);
  const width = total * pps + 200;
  $('tlTracks').style.width = width + 'px';
  $('tlRuler').style.width = width + 'px';
  renderRuler(total, pps);
  ['stickers', 'fx', 'video', 'audio', 'music'].forEach(trackName => {
    const trackEl = $('track' + trackName.charAt(0).toUpperCase() + trackName.slice(1));
    if (!trackEl) return;
    trackEl.innerHTML = '';
    trackEl.style.width = width + 'px';
    clipsByTrack(trackName).forEach(clip => trackEl.appendChild(makeClipEl(clip)));
  });
  $('playhead').style.left = (State.playhead * pps) + 'px';
}

function renderTimeline() { renderTimelineNow(true); }

function renderRuler(totalSec, pps) {
  const ruler = $('tlRuler');
  ruler.innerHTML = '';
  let step = 1;
  if (pps < 30) step = 5;
  else if (pps < 60) step = 2;
  else if (pps > 150) step = 0.5;
  for (let t = 0; t <= totalSec + 1; t += step) {
    const mark = document.createElement('div');
    const isMajor = Math.abs(t % (step * 5)) < 1e-6 || Math.abs(t % 1) < 1e-6;
    mark.className = 'mark' + (isMajor ? '' : ' minor');
    mark.style.left = (t * pps) + 'px';
    if (isMajor) mark.textContent = step >= 1 ? `${Math.round(t)}s` : `${t.toFixed(1)}s`;
    ruler.appendChild(mark);
  }
}

function makeClipEl(clip) {
  const pps = State.pixelsPerSec, media = getMedia(clip.mediaId), dur = getClipDuration(clip);
  const el = document.createElement('div');
  const isParticle = clip.track === 'fx' && isParticleFx(clip.fxId);
  const isMissing = media && media.missing;
  const isSelected = State.selectedIds.includes(clip.id);
  const isMain = clip.id === State.selectedId;
  const cls = clip.track === 'stickers' ? 'sticker-clip' : (isParticle ? 'particle-clip' : clip.track + '-clip');

  el.className = 'clip ' + cls + (isSelected ? (isMain ? ' selected' : ' selected-multi') : '') + (isMissing ? ' missing' : '');
  el.dataset.id = clip.id;
  el.style.left = (clip.start * pps) + 'px';
  el.style.width = Math.max(20, dur * pps) + 'px';

  let bgThumb = '';
  if (media?.thumb) bgThumb = `background-image:url(${media.thumb})`;
  const isFx = clip.track === 'fx', fxDef = isFx ? getFxDef(clip.fxId) : null;
  let html = '';
  if (isFx) {
    html = `<div class="clip-label">${fxDef?.icon || '⚡'} ${escapeHtml(clip.name)}</div><div class="clip-dur">${fmt(dur)}</div><div class="handle left"></div><div class="handle right"></div>`;
  } else if (clip.track === 'stickers') {
    html = `<div class="clip-label">${escapeHtml(clip.emoji)}</div><div class="clip-dur">${fmt(dur)}</div><div class="handle left"></div><div class="handle right"></div>`;
  } else {
    html = `<div class="clip-thumb" style="${bgThumb};opacity:.35"></div><div class="clip-label">${clip.title ? '📝 ' : ''}${escapeHtml(clip.name)}</div>${clip.title ? '<div class="badge-t">T</div>' : ''}${clip.loop ? '<div class="badge-loop">⟳</div>' : ''}${clip.transIn ? '<div class="clip-trans left"></div>' : ''}${clip.transOut ? '<div class="clip-trans right"></div>' : ''}<div class="clip-dur">${fmt(dur)}</div><div class="handle left"></div><div class="handle right"></div>`;
  }
  el.innerHTML = html;
  el.addEventListener('mousedown', e => {
    if (State.tool === 'cut') {
      const rect = el.getBoundingClientRect();
      splitClipAt(clip.id, clip.start + (e.clientX - rect.left) / pps);
      return;
    }
    if (e.target.classList.contains('handle')) return;
    e.stopPropagation();
    if (e.shiftKey || e.ctrlKey || e.metaKey) {
      if (State.selectedIds.includes(clip.id)) {
        State.selectedIds = State.selectedIds.filter(id => id !== clip.id);
        if (State.selectedId === clip.id) State.selectedId = State.selectedIds[0] || null;
      } else {
        State.selectedIds.push(clip.id);
        State.selectedId = clip.id;
      }
      renderTimeline();
      updateInspector();
    } else {
      selectClip(clip.id);
      startDrag(e, clip, 'move', el);
    }
  });
  const leftH = el.querySelector('.handle.left'), rightH = el.querySelector('.handle.right');
  leftH.addEventListener('mousedown', e => { e.stopPropagation(); selectClip(clip.id); startDrag(e, clip, 'trim-left', el); });
  rightH.addEventListener('mousedown', e => { e.stopPropagation(); selectClip(clip.id); startDrag(e, clip, 'trim-right', el); });
  return el;
}

function startDrag(e, clip, mode, el) {
  e.preventDefault();
  const startX = e.clientX;
  const startClip = JSON.parse(JSON.stringify(clip));
  const pps = State.pixelsPerSec;
  const media = getMedia(clip.mediaId);
  const maxDur = clip.track === 'fx' ? 20 : (media?.duration || (clip.track === 'stickers' ? 30 : 60));
  let changed = false;
  function move(ev) {
    const dx = (ev.clientX - startX) / pps;
    if (mode === 'move') {
      clip.start = Math.max(0, startClip.start + dx);
      el.style.left = (clip.start * pps) + 'px';
    } else if (mode === 'trim-left') {
      if (clip.track === 'fx' || clip.track === 'stickers') {
        const ns = Math.max(0, startClip.start + dx);
        clip.start = ns;
        clip.out = Math.max(0.05, (startClip.start + startClip.out) - ns);
      } else {
        const ni = clamp(startClip.in + dx * clip.speed, 0, startClip.out - 0.05);
        const delta = ni - startClip.in;
        clip.in = ni;
        clip.start = Math.max(0, startClip.start + delta / clip.speed);
      }
      el.style.left = (clip.start * pps) + 'px';
      el.style.width = Math.max(20, getClipDuration(clip) * pps) + 'px';
    } else if (mode === 'trim-right') {
      if (clip.track === 'fx' || clip.track === 'stickers') {
        const ne = Math.max(clip.start + 0.05, startClip.start + startClip.out + dx);
        clip.out = ne - clip.start;
      } else {
        clip.out = clamp(startClip.out + dx * clip.speed, startClip.in + 0.05, maxDur);
      }
      el.style.width = Math.max(20, getClipDuration(clip) * pps) + 'px';
    }
    changed = true;
    updateInspector();
    updateTimeDisplay();
    const dur = el.querySelector('.clip-dur');
    if (dur) dur.textContent = fmt(getClipDuration(clip));
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    if (changed) { snapshot(); rebuildClipIndex(); renderAll(); }
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function splitClipAt(clipId, globalTime) {
  const clip = State.clips.find(c => c.id === clipId);
  if (!clip) return;
  if (clip.track === 'fx' || clip.track === 'stickers') {
    toast('FX и стикеры не режутся', 'warn');
    return;
  }
  const splitPoint = clip.in + (globalTime - clip.start) * clip.speed;
  if (splitPoint <= clip.in + 0.05 || splitPoint >= clip.out - 0.05) return;
  const right = JSON.parse(JSON.stringify(clip));
  right.id = uid();
  right.in = splitPoint;
  right.start = globalTime;
  clip.out = splitPoint;
  State.clips.push(right);
  State.selectedId = right.id;
  State.selectedIds = [right.id];
  snapshot();
  rebuildClipIndex();
  renderAll();
  toast('Клип разрезан');
}

function deleteSelected() {
  if (State.selectedIds.length === 0) return;
  const n = State.selectedIds.length;
  State.clips = State.clips.filter(c => !State.selectedIds.includes(c.id));
  State.selectedId = null;
  State.selectedIds = [];
  snapshot();
  rebuildClipIndex();
  renderAll();
  toast(`Удалено: ${n}`);
}

function duplicateSelected() {
  const clipsToCopy = getSelectedClips();
  if (clipsToCopy.length === 0) return;
  const newIds = [];
  clipsToCopy.forEach(c => {
    const copy = JSON.parse(JSON.stringify(c));
    copy.id = uid();
    copy.start = c.start + getClipDuration(c);
    State.clips.push(copy);
    newIds.push(copy.id);
  });
  State.selectedIds = newIds;
  State.selectedId = newIds[0];
  snapshot();
  rebuildClipIndex();
  renderAll();
  toast(`Продублировано: ${clipsToCopy.length}`);
}

/* ============ MARQUEE ============ */
const tlScroll = $('tlScroll'), marqueeBox = $('marqueeBox');
let marqueeStart = null, marqueeActive = false;

tlScroll.addEventListener('mousedown', (e) => {
  if (e.target.closest('.clip')) return;
  if (State.tool === 'cut') return;
  e.preventDefault();
  const rect = tlScroll.getBoundingClientRect();
  marqueeStart = { x: e.clientX - rect.left + tlScroll.scrollLeft, y: e.clientY - rect.top + tlScroll.scrollTop };
  marqueeActive = true;
  marqueeBox.style.left = (e.clientX - rect.left) + 'px';
  marqueeBox.style.top = (e.clientY - rect.top) + 'px';
  marqueeBox.style.width = '0px';
  marqueeBox.style.height = '0px';
  marqueeBox.classList.add('show');
  if (!e.shiftKey && !e.ctrlKey && !e.metaKey) {
    State.selectedIds = [];
    State.selectedId = null;
    renderTimeline();
  }
});

document.addEventListener('mousemove', (e) => {
  if (!marqueeActive || !marqueeStart) return;
  const rect = tlScroll.getBoundingClientRect();
  const currentX = e.clientX - rect.left + tlScroll.scrollLeft;
  const currentY = e.clientY - rect.top + tlScroll.scrollTop;
  const left = Math.min(marqueeStart.x, currentX);
  const top = Math.min(marqueeStart.y, currentY);
  const width = Math.abs(currentX - marqueeStart.x);
  const height = Math.abs(currentY - marqueeStart.y);
  marqueeBox.style.left = (left - tlScroll.scrollLeft) + 'px';
  marqueeBox.style.top = (top - tlScroll.scrollTop) + 'px';
  marqueeBox.style.width = width + 'px';
  marqueeBox.style.height = height + 'px';

  const pps = State.pixelsPerSec;
  const selected = [];
  State.clips.forEach(clip => {
    const trackIndex = ['stickers', 'fx', 'video', 'audio', 'music'].indexOf(clip.track);
    if (trackIndex === -1) return;
    const clipLeft = clip.start * pps, clipRight = clipLeft + getClipDuration(clip) * pps;
    const trackTop = trackIndex * 48;
    const trackBottom = trackTop + 48;
    if (clipLeft < left + width && clipRight > left && trackTop < top + height && trackBottom > top) selected.push(clip.id);
  });
  State.selectedIds = selected;
  State.selectedId = selected[0] || null;
  renderTimeline();
});

document.addEventListener('mouseup', () => {
  if (marqueeActive) {
    marqueeActive = false;
    marqueeStart = null;
    marqueeBox.classList.remove('show');
    if (State.selectedIds.length > 0) {
      updateInspector();
      toast(`Выделено: ${State.selectedIds.length}`);
    }
  }
});

tlScroll.addEventListener('click', (e) => {
  if (e.target.closest('.clip')) return;
  if (marqueeActive) return;
  const rect = tlScroll.getBoundingClientRect();
  seekTo(Math.max(0, (e.clientX - rect.left + tlScroll.scrollLeft) / State.pixelsPerSec));
});

/* ============ INSPECTOR ============ */
function selectClip(id) {
  State.selectedId = id;
  State.selectedIds = [id];
  renderTimeline();
  updateInspector();
}

function updateInspector() {
  const selected = getSelectedClips();
  if (selected.length === 0) {
    $('inspEmpty').style.display = 'block';
    $('inspEmpty').innerHTML = 'Выберите клип';
    $('inspContent').style.display = 'none';
    return;
  }
  if (selected.length > 1) {
    $('inspEmpty').style.display = 'block';
    $('inspEmpty').innerHTML = `<div style="font-size:14px;font-weight:700;color:var(--acc);margin-bottom:8px">${selected.length} клипов</div>
      <div style="font-size:11px;color:var(--txt-3);line-height:1.6">Del — удалить, Ctrl+D — дублировать.</div>`;
    $('inspContent').style.display = 'none';
    return;
  }

  const c = selected[0];
  $('inspEmpty').style.display = 'none';
  $('inspContent').style.display = 'block';
  const isFx = c.track === 'fx';
  const isSticker = c.track === 'stickers';
  $('trimBlock').style.display = isFx ? 'none' : 'block';
  $('videoPropsBlock').style.display = (isFx || isSticker) ? 'none' : 'block';
  $('fxBlock').style.display = isFx ? 'block' : 'none';
  $('loopBlock').style.display = (c.track === 'music' || c.track === 'audio') ? 'block' : 'none';
  $('propName').value = c.name;

  // Удалить старый блок стикера
  const oldSb = $('inspContent').querySelector('.sticker-edit-block');
  if (oldSb) oldSb.remove();

  if (isFx) {
    const def = getFxDef(c.fxId);
    $('fxType').value = def ? def.name : c.fxId;
    $('fxDur').value = getClipDuration(c).toFixed(2);
    $('fxStart').value = c.start.toFixed(2);
    const paramsBox = $('fxParams');
    paramsBox.innerHTML = '';
    if (def && def.params) {
      for (const key in def.params) {
        const p = def.params[key], val = c.params?.[key] ?? p.default;
        const wrap = document.createElement('div');
        wrap.className = 'fx-param';
        if (p.type === 'color') {
          wrap.innerHTML = `<label>${escapeHtml(key)}</label><div class="color-row"><input type="color" value="${safeHex(val, '#ffdd00')}"><input type="text" value="${escapeHtml(val)}"></div>`;
          const colorInp = wrap.querySelector('input[type=color]'), textInp = wrap.querySelector('input[type=text]');
          colorInp.oninput = e => { c.params[key] = e.target.value; textInp.value = e.target.value; refreshPreview(); };
          textInp.oninput = e => { c.params[key] = e.target.value; if (isHex(e.target.value)) colorInp.value = e.target.value; refreshPreview(); };
        } else {
          const min = p.min ?? 0, max = p.max ?? 100, step = p.step ?? 1;
          wrap.innerHTML = `<label>${escapeHtml(key)}</label><div style="display:flex;align-items:center;gap:8px"><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" style="flex:1;accent-color:var(--warn)"><span style="font-size:11px;font-family:monospace;color:var(--txt-3);min-width:34px;text-align:right">${val}</span></div>`;
          const slider = wrap.querySelector('input');
          slider.oninput = e => { c.params[key] = parseFloat(e.target.value); e.target.nextElementSibling.textContent = e.target.value; refreshPreview(); };
        }
        paramsBox.appendChild(wrap);
      }
    }
  } else if (isSticker) {
    const block = document.createElement('div');
    block.className = 'sticker-edit-block';
    block.innerHTML = `
      <div class="section-title">Стикер</div>
      <div class="field"><label>Размер: <span class="sSizeVal">${c.size || 120}</span>px</label><input type="range" class="sSize" min="20" max="400" value="${c.size || 120}" style="width:100%;accent-color:var(--acc)"></div>
      <div class="field"><label>Поворот: <span class="sRotVal">${c.rotation || 0}</span>°</label><input type="range" class="sRot" min="-180" max="180" value="${c.rotation || 0}" style="width:100%;accent-color:var(--acc)"></div>
      <div class="field"><label>X: <span class="sXVal">${c.x ?? 50}</span>%</label><input type="range" class="sX" min="0" max="100" value="${c.x ?? 50}" style="width:100%;accent-color:var(--acc)"></div>
      <div class="field"><label>Y: <span class="sYVal">${c.y ?? 50}</span>%</label><input type="range" class="sY" min="0" max="100" value="${c.y ?? 50}" style="width:100%;accent-color:var(--acc)"></div>
    `;
    $('videoPropsBlock').appendChild(block);
    block.querySelector('.sSize').oninput = e => { c.size = parseInt(e.target.value); block.querySelector('.sSizeVal').textContent = e.target.value; refreshPreview(); };
    block.querySelector('.sRot').oninput = e => { c.rotation = parseInt(e.target.value); block.querySelector('.sRotVal').textContent = e.target.value; refreshPreview(); };
    block.querySelector('.sX').oninput = e => { c.x = parseInt(e.target.value); block.querySelector('.sXVal').textContent = e.target.value; refreshPreview(); };
    block.querySelector('.sY').oninput = e => { c.y = parseInt(e.target.value); block.querySelector('.sYVal').textContent = e.target.value; refreshPreview(); };
  } else {
    const media = getMedia(c.mediaId), dur = getClipDuration(c);
    $('propIn').value = fmt(c.in);
    $('propOut').value = fmt(c.out);
    $('propDur').textContent = fmt(dur);
    $('propRes').textContent = media?.width ? `${media.width}×${media.height}` : '—';
    $('propFps').textContent = media?.type === 'image' ? '—' : '30';
    $('propType').textContent = media?.missing ? '⚠ потерян' : (media?.type || '—');
    const maxDur = media?.duration || 1;
    $('trimRange').style.left = ((c.in / maxDur) * 100) + '%';
    $('trimRange').style.width = (((c.out - c.in) / maxDur) * 100) + '%';
    document.querySelectorAll('#speedRow button').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === c.speed));
    if (c.fx) {
      $('pBrightness').value = c.fx.brightness; $('vBrightness').textContent = c.fx.brightness;
      $('pContrast').value = c.fx.contrast; $('vContrast').textContent = c.fx.contrast;
      $('pSaturate').value = c.fx.saturate; $('vSaturate').textContent = c.fx.saturate;
      $('pHue').value = c.fx.hue; $('vHue').textContent = c.fx.hue;
      $('pBlur').value = c.fx.blur; $('vBlur').textContent = c.fx.blur;
      $('pSepia').value = c.fx.sepia; $('vSepia').textContent = c.fx.sepia;
      $('pOpacity').value = c.fx.opacity; $('vOpacity').textContent = c.fx.opacity;
    }
    $('pVolume').value = Math.round((c.volume || 1) * 100); $('vVolume').textContent = Math.round((c.volume || 1) * 100);
    $('pFadeIn').value = Math.round(c.fadeIn * 1000); $('vFadeIn').textContent = (c.fadeIn * 1000).toFixed(0);
    $('pFadeOut').value = Math.round(c.fadeOut * 1000); $('vFadeOut').textContent = (c.fadeOut * 1000).toFixed(0);
    $('pLoop').checked = !!c.loop;
  }
}

function bindInspector() {
  $('propName').oninput = e => { const c = getSelectedClip(); if (!c) return; c.name = e.target.value; scheduleRenderTimeline(true); };
  $('propIn').onchange = e => { const c = getSelectedClip(); if (!c) return; c.in = clamp(parseTime(e.target.value), 0, c.out - 0.05); renderAll(); snapshot(); };
  $('propOut').onchange = e => { const c = getSelectedClip(); if (!c) return; const m = getMedia(c.mediaId), max = m?.duration || 60; c.out = clamp(parseTime(e.target.value), c.in + 0.05, max); renderAll(); snapshot(); };
  document.querySelectorAll('#speedRow button').forEach(b => {
    b.onclick = () => { const c = getSelectedClip(); if (!c) return; c.speed = parseFloat(b.dataset.speed); snapshot(); renderAll(); };
  });
  $('fxDur').onchange = e => { const c = getSelectedClip(); if (!c || c.track !== 'fx') return; c.out = clamp(parseFloat(e.target.value) || 0.3, 0.05, 20); renderAll(); snapshot(); };
  $('fxStart').onchange = e => { const c = getSelectedClip(); if (!c || c.track !== 'fx') return; c.start = Math.max(0, parseFloat(e.target.value) || 0); renderAll(); snapshot(); };
  const bindFx = (inputId, valId, param) => {
    $(inputId).oninput = e => {
      const v = parseFloat(e.target.value);
      $(valId).textContent = e.target.value;
      const c = getSelectedClip();
      if (!c) return;
      c.fx[param] = v;
      refreshPreview();
    };
  };

    document.addEventListener('mouseup', () => this.onMouseUp());
