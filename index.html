  getAngleFromCenter(e) {
    const rect = this.canvas.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
  },

  renderGrid() {
    const g = $('thumbGrid');
    g.innerHTML = '';
    for (let i = 1; i < 3; i++) {
      const v = document.createElement('div'); v.className = 'gl v'; v.style.left = (i * 33.33) + '%'; g.appendChild(v);
      const h = document.createElement('div'); h.className = 'gl h'; h.style.top = (i * 33.33) + '%'; g.appendChild(h);
    }
  },

  addTitle() {
    const el = {
      id: uid(), type: 'text', text: 'ЗАГОЛОВОК',
      x: 50, y: 50, size: 96,
      color: '#ffffff', strokeColor: '#000000', strokeWidth: 4,
      font: "'Montserrat', sans-serif", weight: 900,
      shadow: true, rotate: 0, align: 'center',
    };
    this.elements.push(el);
    this.selected = el;
    this.render();
    this.updateSelFrame();
    this.updateProps();
  },

  addSubtitle() {
    const el = {
      id: uid(), type: 'text', text: 'ПОДЗАГОЛОВОК',
      x: 50, y: 15, size: 42,
      color: '#ffffff', strokeColor: '#000000', strokeWidth: 3,
      font: "'Montserrat', sans-serif", weight: 700,
      shadow: true, rotate: 0, align: 'center',
    };
    this.elements.push(el);
    this.selected = el;
    this.render();
    this.updateSelFrame();
    this.updateProps();
  },

  addEmoji(e) {
    const el = { id: uid(), type: 'emoji', emoji: e, x: 75, y: 50, size: 160, rotate: 0 };
    this.elements.push(el);
    this.selected = el;
    this.render();
    this.updateSelFrame();
    this.updateProps();
  },

  addShape() {
    const el = {
      id: uid(), type: 'shape', shape: 'rect',
      x: 50, y: 50, w: 300, h: 100,
      color: '#5b8cff', alpha: 0.8, rotate: 0,
    };
    this.elements.push(el);
    this.selected = el;
    this.render();
    this.updateSelFrame();
    this.updateProps();
  },

  onMouseDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (this.canvasW / rect.width);
    const my = (e.clientY - rect.top) * (this.canvasH / rect.height);
    let hit = null;
    for (let i = this.elements.length - 1; i >= 0; i--) {
      const el = this.elements[i];
      const box = this.getBBox(el);
      if (mx >= box.x && mx <= box.x + box.w && my >= box.y && my <= box.y + box.h) { hit = el; break; }
    }
    if (hit) {
      this.selected = hit;
      this.elements = [...this.elements.filter(e => e.id !== hit.id), hit];
      this.dragging = { el: hit, offsetX: mx - (hit.x / 100 * this.canvasW), offsetY: my - (hit.y / 100 * this.canvasH) };
      this.render();
      this.updateSelFrame();
      this.updateProps();
    } else {
      this.selected = null;
      this.render();
      this.updateSelFrame();
      this.updateProps();
    }
  },

  onMouseMove(e) {
    if (!this.dragging && !this.resizing && !this.rotating) return;
    const rect = this.canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (this.canvasW / rect.width);
    const my = (e.clientY - rect.top) * (this.canvasH / rect.height);

    if (this.dragging) {
      const el = this.dragging.el;
      let nx = ((mx - this.dragging.offsetX) / this.canvasW) * 100;
      let ny = ((my - this.dragging.offsetY) / this.canvasH) * 100;
      if (Math.abs(nx - 50) < 2) nx = 50;
      if (Math.abs(ny - 50) < 2) ny = 50;
      el.x = clamp(nx, 0, 100);
      el.y = clamp(ny, 0, 100);
      this.render();
      this.updateSelFrame();
    } else if (this.resizing) {
      const el = this.selected;
      const dx = mx - el.x / 100 * this.canvasW;
      const dy = my - el.y / 100 * this.canvasH;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (el.type === 'emoji') el.size = Math.max(30, Math.min(500, dist * 2));
      else if (el.type === 'text') el.size = Math.max(10, Math.min(300, dist / 1.5));
      else if (el.type === 'shape') { el.w = Math.max(30, Math.abs(dx) * 2); el.h = Math.max(30, Math.abs(dy) * 2); }
      this.render();
      this.updateSelFrame();
    } else if (this.rotating) {
      const angle = this.getAngleFromCenter(e);
      this.selected.rotate = angle - this.rotating.startAngle + (this.rotating.startElRotate || 0);
      this.render();
      this.updateSelFrame();
    }
  },

  onMouseUp() {
    if (this.dragging || this.resizing || this.rotating) {
      this.dragging = null;
      this.resizing = null;
      this.rotating = null;
    }
  },

  getBBox(el) {
    const W = this.canvasW, H = this.canvasH;
    const cx = el.x / 100 * W;
    const cy = el.y / 100 * H;
    if (el.type === 'text') {
      this.ctx.save();
      this.ctx.font = `${el.weight} ${el.size}px ${el.font}`;
      const lines = el.text.split('\n');
      let maxW = 0;
      lines.forEach(l => { const m = this.ctx.measureText(l); if (m.width > maxW) maxW = m.width; });
      this.ctx.restore();
      const w = maxW + 20;
      const h = lines.length * el.size * 1.2 + 20;
      return { x: cx - w / 2, y: cy - h / 2, w, h };
    } else if (el.type === 'emoji') {
      return { x: cx - el.size / 2, y: cy - el.size / 2, w: el.size, h: el.size };
    } else if (el.type === 'shape') {
      return { x: cx - el.w / 2, y: cy - el.h / 2, w: el.w, h: el.h };
    }
    return { x: cx - 50, y: cy - 50, w: 100, h: 100 };
  },

  render() {
    const W = this.canvasW, H = this.canvasH;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    if (this.bg.type === 'gradient') {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, this.bg.colors[0]);
      g.addColorStop(1, this.bg.colors[1] || this.bg.colors[0]);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = this.bg.colors[0];
    }
    ctx.fillRect(0, 0, W, H);
    this.elements.forEach(el => this.drawElement(el));
    this.updateSelFrame();
  },

  drawElement(el) {
    const ctx = this.ctx;
    const W = this.canvasW, H = this.canvasH;
    const cx = el.x / 100 * W;
    const cy = el.y / 100 * H;

    ctx.save();
    if (el.rotate) {
      ctx.translate(cx, cy);
      ctx.rotate(el.rotate * Math.PI / 180);
      ctx.translate(-cx, -cy);
    }

    if (el.type === 'text') {
      ctx.font = `${el.weight} ${el.size}px ${el.font}`;
      ctx.textAlign = el.align || 'center';
      ctx.textBaseline = 'middle';
      const lines = (el.text || '').split('\n');
      const lineHeight = el.size * 1.15;
      const totalH = lines.length * lineHeight;
      const startY = cy - totalH / 2 + lineHeight / 2;
      if (el.strokeWidth > 0) {
        ctx.strokeStyle = safeHex(el.strokeColor);
        ctx.lineWidth = el.strokeWidth;
        ctx.lineJoin = 'round';
        lines.forEach((line, i) => ctx.strokeText(line, cx, startY + i * lineHeight));
      }
      if (el.shadow) {
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 3;
      }
      ctx.fillStyle = safeHex(el.color, '#ffffff');
      lines.forEach((line, i) => ctx.fillText(line, cx, startY + i * lineHeight));
    } else if (el.type === 'emoji') {
      ctx.font = `${el.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 10;
      ctx.fillText(el.emoji, cx, cy);
    } else if (el.type === 'shape') {
      ctx.globalAlpha = el.alpha || 1;
      ctx.fillStyle = safeHex(el.color, '#5b8cff');
      if (el.shape === 'rect') {
        ctx.fillRect(cx - el.w / 2, cy - el.h / 2, el.w, el.h);
      } else if (el.shape === 'circle') {
        ctx.beginPath(); ctx.arc(cx, cy, el.w / 2, 0, Math.PI * 2); ctx.fill();
      } else if (el.shape === 'triangle') {
        ctx.beginPath();
        ctx.moveTo(cx, cy - el.h / 2);
        ctx.lineTo(cx + el.w / 2, cy + el.h / 2);
        ctx.lineTo(cx - el.w / 2, cy + el.h / 2);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  },

/* ============ EXPORT MP4 ============ */
let exporting = false;

function cssFilterV(fx) {
  if (!fx) return 'none';
  const parts = [];
  if (fx.brightness !== 100) parts.push(`brightness(${fx.brightness}%)`);
  if (fx.contrast !== 100) parts.push(`contrast(${fx.contrast}%)`);
  if (fx.saturate !== 100) parts.push(`saturate(${fx.saturate}%)`);
  if (fx.hue !== 0) parts.push(`hue-rotate(${fx.hue}deg)`);
  if (fx.blur > 0) parts.push(`blur(${fx.blur}px)`);
  if (fx.sepia > 0) parts.push(`sepia(${fx.sepia}%)`);
  if (fx.grayscale > 0) parts.push(`grayscale(${fx.grayscale}%)`);
  if (fx.invert > 0) parts.push(`invert(${fx.invert}%)`);
  return parts.length ? parts.join(' ') : 'none';
}

async function renderFrameToCanvas(ex, t, W, H) {
  ex.fillStyle = '#000';
  ex.fillRect(0, 0, W, H);

  const active = getActiveVideoClip(t);
  const media = active ? getMedia(active.mediaId) : null;
  const activeFx = getActiveFxAt(t);
  const fxT = computeFxStack(activeFx);

  if (active && media && media.el && !media.missing) {
    const v = media.el;
    if (media.type === 'image') {
      ex.save();
      const sw = v.naturalWidth || v.width;
      const sh = v.naturalHeight || v.height;
      const scale = Math.min(W / sw, H / sh) * (fxT.scale || 1);
      const dw = sw * scale, dh = sh * scale;
      const sx = fxT.flipX ? -1 : 1;
      ex.translate(W / 2, H / 2);
      ex.scale(sx, 1);
      ex.drawImage(v, -dw / 2 + (fxT.x || 0), -dh / 2 + (fxT.y || 0), dw, dh);
      ex.restore();
    } else {
      const targetTime = clamp((t - active.start) * active.speed + active.in, 0, v.duration || 0);
      if (Math.abs(v.currentTime - targetTime) > 0.08) {
        await new Promise(res => {
          let done = false;
          const h = () => {
            if (done) return;
            done = true;
            v.removeEventListener('seeked', h);
            res();
          };
          v.addEventListener('seeked', h);
          v.currentTime = targetTime;
          setTimeout(h, 400);
        });
      }
      ex.save();
      ex.filter = cssFilterV(active.fx) + (fxT.extraFilter ? ' ' + fxT.extraFilter : '');
      ex.globalAlpha = fxT.alpha || 1;
      const sw = v.videoWidth, sh = v.videoHeight;
      const scale = Math.min(W / sw, H / sh) * (fxT.scale || 1);
      const dw = sw * scale, dh = sh * scale;
      const sx = fxT.flipX ? -1 : 1;
      ex.translate(W / 2, H / 2);
      ex.rotate(fxT.rotation || 0);
      ex.scale(sx, 1);
      ex.drawImage(v, -dw / 2 + (fxT.x || 0), -dh / 2 + (fxT.y || 0), dw, dh);
      ex.restore();
    }
  }

  const particles = activeFx.filter(f => isParticleFx(f.id));
  if (particles.length > 0) particles.forEach(fx => drawParticleEffect(ex, fx, W, H, t));

  State.clips.forEach(clip => {
    if (clip.track !== 'video' || !clip.title) return;
    if (t < clip.start || t >= clip.start + getClipDuration(clip)) return;
    drawTitle(ex, clip, W, H);
  });

  State.clips.forEach(clip => {
    if (clip.track !== 'stickers') return;
    if (t < clip.start || t >= clip.start + getClipDuration(clip)) return;
    drawSticker(ex, clip, W, H);
  });
}

async function exportVideo() {
  if (exporting) return;
  const total = getTimelineDuration();
  if (total === 0) return toast('Нет контента', 'warn');
  exporting = true;
  $('btnExport').disabled = true;

  const overlay = $('progressOverlay');
  overlay.classList.add('show');
  $('progressFill').style.width = '0%';
  $('progressPct').textContent = '0%';
  $('progressTitle').textContent = '🎥 Запись (WebM)';
  $('progressStage').textContent = 'Рендеринг кадров';
  setStatus('Экспорт');

  let audioCtx = null, dest = null;
  try {
    const W = State.projectW, H = State.projectH;
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = W;
    exportCanvas.height = H;
    const ex = exportCanvas.getContext('2d', { alpha: false, willReadFrequently: false });
    ex.fillStyle = '#000';
    ex.fillRect(0, 0, W, H);

    // === АУДИО ===
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    dest = audioCtx.createMediaStreamDestination();
    // SFX тоже должны попасть в экспорт — через отдельный gain-нод
    const sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 1;
    sfxGain.connect(dest);

    const connectedMedia = new Set();
    State.media.forEach(m => {
      if (!m.el || !m.el.play || m.missing) return;
      if (connectedMedia.has(m.el)) return;
      try {
        if (!m._srcNode) {
          m._srcNode = audioCtx.createMediaElementSource(m.el);
          m._srcNode.connect(dest);
          m._srcNode.connect(audioCtx.destination); // слышно при экспорте
        }
        connectedMedia.add(m.el);
      } catch (e) {}
    });

    const stream = exportCanvas.captureStream(State.fps);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));

    let mime = 'video/webm;codecs=vp9,opus';
    if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8,opus';
    if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 128_000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

    // === РЕАЛЬНОЕ ВРЕМЯ (аудио не паузим) ===
    State.media.forEach(m => { if (m.el && m.el.pause) m.el.pause(); });
    rec.start();

    const startReal = performance.now();
    lastSfxTime = 0;

    await new Promise(resolve => {
      const renderFrame = async () => {
        const elapsed = (performance.now() - startReal) / 1000;
        // SFX в экспорте
        State.clips.forEach(c => {
          if (c.sfx && c.start >= lastSfxTime && c.start < elapsed) {
            SFXPlayer.play(c.sfx, null, c.volume || 1);
          }
        });
        lastSfxTime = elapsed;

        // Проигрываем видео-элемент синхронно
        const active = getActiveVideoClip(elapsed);
        if (active) {
          const media = getMedia(active.mediaId);
          if (media && media.el && media.type === 'video' && !media.missing) {
            const v = media.el;
            if (v.src !== media.url) { v.src = media.url; v.load(); }
            const localTarget = clamp((elapsed - active.start) * active.speed + active.in, 0, v.duration || 0);
            if (Math.abs(v.currentTime - localTarget) > 0.25) v.currentTime = localTarget;
            v.playbackRate = active.speed;
            v.volume = clamp(active.volume, 0, 1);
            if (v.paused) v.play().catch(() => {});
          }
        }

        await renderFrameToCanvas(ex, elapsed, W, H);

        const pct = Math.min(100, Math.round((elapsed / total) * 100));
        $('progressFill').style.width = pct + '%';
        $('progressPct').textContent = pct + '%';
        $('progressStage').textContent = `Кадр ${elapsed.toFixed(1)} / ${total.toFixed(1)}s`;

        if (elapsed >= total) { resolve(); return; }
        requestAnimationFrame(renderFrame);
      };
      renderFrame();
    });

    State.media.forEach(m => { if (m.el && m.el.pause) m.el.pause(); });
    await sleep(400);
    rec.stop();
    await new Promise(r => { rec.onstop = r; });

    const webmBlob = new Blob(chunks, { type: 'video/webm' });

    // MP4 конвертация
    $('progressTitle').textContent = '⚙️ Конвертация в MP4';
    $('progressFill').style.width = '0%';
    $('progressPct').textContent = '0%';
    $('progressStage').textContent = 'Загрузка FFmpeg';

    const ok = await initFFmpeg();
    if (!ok) throw new Error('FFmpeg не загрузился');

    const webmData = new Uint8Array(await webmBlob.arrayBuffer());
    await ffmpeg.writeFile('input.webm', webmData);
    $('progressFill').style.width = '30%';
    $('progressPct').textContent = '30%';
    $('progressStage').textContent = 'FFmpeg конвертирует…';

    await ffmpeg.exec([
      '-i', 'input.webm',
      '-c:v', 'libx264',
      '-preset', 'ultrafast',
      '-crf', '23',
      '-c:a', 'aac',
      '-b:a', '128k',
      '-movflags', '+faststart',
      'output.mp4'
    ]);

    $('progressFill').style.width = '90%';
    $('progressPct').textContent = '90%';
    $('progressStage').textContent = 'Сохранение…';

    const mp4Data = await ffmpeg.readFile('output.mp4');
    const mp4Blob = new Blob([mp4Data.buffer], { type: 'video/mp4' });

    await ffmpeg.deleteFile('input.webm');
    await ffmpeg.deleteFile('output.mp4');

    const fileName = `procut_export_${Date.now()}.mp4`;
    if (FS.dirHandle) {
      try {
        await FS.writeFile('exports', fileName, mp4Blob);
        toast(`✅ Сохранено: exports/${fileName}`, 'ok');
      } catch (e) {
        const url = URL.createObjectURL(mp4Blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }
    } else {
      const url = URL.createObjectURL(mp4Blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    $('progressFill').style.width = '100%';
    $('progressPct').textContent = '100%';
    toast('🎬 MP4 готов!', 'ok');
  } catch (err) {
    console.error(err);
    toast('Ошибка: ' + err.message, 'err');
  } finally {
    overlay.classList.remove('show');
    setStatus('Готов');
    exporting = false;
    $('btnExport').disabled = false;
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
  }
}

/* ============ SAVE / LOAD ============ */
function serializeProject() {
  return {
    id: State.currentProjectId || uid(),
    name: State.projectName,
    date: Date.now(),
    projectW: State.projectW,
    projectH: State.projectH,
    fps: State.fps,
    thumb: State.media.find(m => m.thumb)?.thumb || '',
    clips: State.clips,
    media: State.media.map(m => ({
      id: m.id, type: m.type, name: m.name, duration: m.duration,
      width: m.width, height: m.height, thumb: m.thumb,
      diskName: m.diskName, defaultTrack: m.defaultTrack
    }))
  };
}

async function saveProject(silent = false) {
  const proj = serializeProject();
  State.currentProjectId = proj.id;
  let savedToDisk = false;
  if (FS.dirHandle) {
    try { await FS.saveProjectToDisk(proj); savedToDisk = true; } catch (e) {}
  }
  LS.save(proj);
  markSaved();
  if (!silent) {
    if (savedToDisk) toast(`Проект "${proj.name}" сохранён`, 'ok');
    else toast(`Проект сохранён локально`, 'warn');
  }
}

async function loadProject(id, silent = false) {
  let proj = null;
  if (FS.dirHandle) { try { proj = await FS.loadProjectFromDisk(id); } catch (e) {} }
  if (!proj) proj = LS.get(id);
  if (!proj) { toast('Проект не найден', 'err'); return; }

  if (!FS.dirHandle && FS.hasFS) {
    const gotPending = await FS.requestPendingAccess().catch(() => false);
    if (!gotPending) { $('restoreBanner').classList.add('show'); toast('Папка не открыта', 'warn'); }
  }

  // Ревок старых URL
  State.media.forEach(m => { if (m.url) URL.revokeObjectURL(m.url); });

  const newMedia = [];
  let missingCount = 0, restoredFromLibrary = 0;

  for (const m of (proj.media || [])) {
    let file = null;
    if (FS.dirHandle && m.diskName) { try { file = await FS.readFile('media', m.diskName); } catch (e) {} }
    if (!file) {
      const found = State.media.find(lib => lib.name === m.name && lib.file);
      if (found) { file = found.file; restoredFromLibrary++; }
    }
    if (!file) {
      newMedia.push({ ...m, file: null, url: '', el: null, missing: true });
      missingCount++;
      continue;
    }
    const url = URL.createObjectURL(file);
    let el, width, height, duration, thumb;
    if (m.type === 'image') {
      el = new Image(); el.src = url;
      await new Promise(r => { el.onload = r; el.onerror = r; });
      width = el.naturalWidth; height = el.naturalHeight; duration = 5; thumb = url;
    } else {
      el = document.createElement(m.type === 'video' ? 'video' : 'audio');
      el.src = url; el.preload = 'metadata';
      try { await Promise.race([new Promise(r => { el.onloadedmetadata = r; el.onerror = r; }), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
      duration = el.duration || 0; width = el.videoWidth || 0; height = el.videoHeight || 0; thumb = m.thumb || '';
    }
    newMedia.push({ id: m.id, type: m.type, name: m.name, file, url, duration: m.duration || duration, width: m.width || width, height: m.height || height, thumb: m.thumb || thumb, el, diskName: m.diskName, defaultTrack: m.defaultTrack || null, missing: false });
  }

  State.media = newMedia;
  State.clips = proj.clips || [];
  State.projectName = proj.name;
  State.currentProjectId = proj.id;
  State.projectW = proj.projectW || 1280;
  State.projectH = proj.projectH || 720;
  State.fps = proj.fps || 30;
  State.selectedId = null;
  State.selectedIds = [];
  State.playhead = 0;
  rebuildClipIndex();
  markSaved();
  enterEditor();
  if (missingCount > 0) {
    const stillMissing = newMedia.filter(m => m.missing).length;
    if (stillMissing > 0) toast(`⚠️ ${stillMissing} видео не найдено`, 'err');
    else toast(`✅ Восстановлено ${restoredFromLibrary} файлов`, 'ok');
  } else if (!silent) { toast(`Проект открыт`, 'ok'); }
}

async function renderLauncherProjects() {
  const container = $('projectsContainer');
  let projects = [];
  if (FS.dirHandle) { try { projects = await FS.listProjects(); } catch (e) {} }
  const lsProjects = LS.getAll();
  const ids = new Set(projects.map(p => p.id));
  for (const lp of lsProjects) if (!ids.has(lp.id)) projects.push(lp);
  $('projectsCount').textContent = projects.length;
  if (projects.length === 0) {
    container.innerHTML = `<div class="empty-launcher">
      <div class="big-ico">📁</div>
      <h3>Пока нет проектов</h3>
      <p>Нажмите «+ Новый проект» сверху.</p>
    </div>`;
    return;
  }
  projects.sort((a, b) => (b.date || 0) - (a.date || 0));
  const grid = document.createElement('div');
  grid.className = 'projects-grid';
  projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <div class="thumb">${p.thumb ? `<img src="${escapeHtml(p.thumb)}">` : '🎬'}<div class="cnt-badge">${p.clips?.length || 0}</div></div>
      <div class="pinfo"><div class="ptitle">${escapeHtml(p.name)}</div><div class="pdate">${p.date ? new Date(p.date).toLocaleString('ru-RU') : '—'}</div></div>
      <div class="pactions"><button class="open-btn">▶ Открыть</button><button class="delete-btn danger">×</button></div>
    `;
    card.querySelector('.open-btn').onclick = async (e) => { e.stopPropagation(); await loadProject(p.id); };
    card.querySelector('.delete-btn').onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(`Удалить "${p.name}"?`)) return;
      if (FS.dirHandle) { try { await FS.deleteFile('projects', p.id + '.json'); } catch (err) {} }
      LS.delete(p.id);
      await renderLauncherProjects();
      toast('Удалён');
    };
    grid.appendChild(card);
  });
  container.innerHTML = '';
  container.appendChild(grid);
}

async function runAIMontage(videoMedia, onProgress) {
  const modeConfig = {
    dynamic:   { clipDur: 1.5, gap: 0.0, useFx: true,  fxChance: 0.4, useTitles: false, colorFx: { contrast: 120, saturate: 130 } },
    cinematic: { clipDur: 3.0, gap: 0.3, useFx: false, fxChance: 0.1, useTitles: true,  colorFx: { contrast: 115, saturate: 95, hue: -5 } },
    vlog:      { clipDur: 2.0, gap: 0.1, useFx: true,  fxChance: 0.2, useTitles: false, colorFx: { brightness: 110, saturate: 120 } },
    short:     { clipDur: 1.0, gap: 0.0, useFx: true,  fxChance: 0.5, useTitles: true,  colorFx: { contrast: 130, saturate: 140 } }
  }[aiSettings.mode] || { clipDur: 1.5, gap: 0, useFx: true, fxChance: 0.4, useTitles: false, colorFx: {} };

  onProgress(2, 'Анализ…');
  await sleep(50);

  const analyzed = [];
  for (let i = 0; i < videoMedia.length; i++) {
    const m = videoMedia[i];
    onProgress(2 + (i / videoMedia.length) * 20, `Анализ ${i + 1}/${videoMedia.length}`);
    await sleep(10);
    if (m.type === 'image') {
      analyzed.push({ media: m, segments: [{ start: 0, dur: Math.min(modeConfig.clipDur, m.duration || 5), score: 0.7 }] });
    } else {
      const dur = m.duration || 5;
      const segCount = Math.max(3, Math.min(30, Math.floor(dur / modeConfig.clipDur)));
      const segs = [];
      for (let s = 0; s < segCount; s++) {
        const segDur = dur / segCount;
        const segStart = s * segDur;
        const midness = 1 - Math.abs((segStart + segDur / 2) / dur - 0.5) * 0.6;
        const rnd = 0.4 + Math.random() * 0.6;
        segs.push({ start: segStart, dur: segDur, score: midness * rnd });
      }
      analyzed.push({ media: m, segments: segs });
    }
  }

  onProgress(25, 'Оценка…');
  await sleep(50);

  const allSegs = [];
  analyzed.forEach(a => a.segments.forEach(s => allSegs.push({ ...s, media: a.media })));
  allSegs.sort((a, b) => b.score - a.score);
  const numClips = Math.max(3, Math.min(200, Math.floor(aiSettings.targetDur / modeConfig.clipDur)));
  const selected = allSegs.slice(0, numClips);

  onProgress(40, 'Создание клипов…');
  await sleep(30);

  const newClips = [];
  let cursor = 0;
  selected.forEach(seg => {
    const m = seg.media;
    const dur = m.duration || 5;
    const inT = Math.max(0, Math.min(seg.start, dur - 0.1));
    const outT = Math.min(dur, inT + modeConfig.clipDur);
    if (outT - inT < 0.1) return;
    newClips.push({
      id: uid(), mediaId: m.id, track: 'video', start: cursor,
      in: inT, out: outT, speed: 1, volume: 1,
      name: m.name.replace(/\.[^.]+$/, ''), type: m.type,
      fx: { ...DEFAULT_FX, ...(modeConfig.colorFx || {}) },
      fadeIn: 0, fadeOut: 0, transIn: null, transOut: null, title: null, sfx: null, loop: false
    });
    cursor += (outT - inT) + modeConfig.gap;
  });

  onProgress(65, 'Переходы…');
  await sleep(30);

  if (modeConfig.useTitles && newClips.length > 0) {
    newClips[0].title = {
      text: State.projectName, font: "'Inter', sans-serif", size: 72,
      color: '#fff', weight: 700, align: 'center', shadow: true, bg: false,
      strokeWidth: 0, x: 50, y: 15
    };
  }

  const transPool = ['crossfade', 'dipBlack', 'slideLeft', 'zoomIn', 'glitch'];
  newClips.forEach((clip, idx) => {
    if (idx > 0 && Math.random() < 0.7) clip.transIn = { id: transPool[Math.floor(Math.random() * transPool.length)], dur: 0.4 };
    if (idx < newClips.length - 1 && Math.random() < 0.5) clip.transOut = { id: transPool[Math.floor(Math.random() * transPool.length)], dur: 0.3 };
  });

  const fxClips = [];
  if (modeConfig.useFx) {
    const fxPool = ['flash', 'shake', 'zoomPunch', 'glitch', 'bloom', 'vignette', 'snow', 'sparks'];
    newClips.forEach(clip => {
      if (Math.random() < modeConfig.fxChance) {
        const fxId = fxPool[Math.floor(Math.random() * fxPool.length)];
        const fxDef = getFxDef(fxId);
        if (fxDef) {
          const params = {};
          if (fxDef.params) for (const k in fxDef.params) params[k] = fxDef.params[k].default;
          fxClips.push({
            id: uid(), mediaId: null, track: 'fx',
            start: clip.start + Math.random() * (clip.out - clip.in) * 0.5,
            in: 0, out: fxDef.dur, speed: 1, volume: 1,
            name: fxDef.name, type: 'fx', fxId, target: 'video', params,
            fx: { ...DEFAULT_FX },
            fadeIn: 0, fadeOut: 0, transIn: null, transOut: null, title: null, sfx: null
          });
        }
      }
    });
  }

  onProgress(90, 'Финализация…');
  await sleep(30);

  State.clips = [...newClips, ...fxClips];
  State.selectedId = null;
  State.selectedIds = [];
  State.playhead = 0;
  rebuildClipIndex();
  markUnsaved();
  onProgress(100, 'Готово');
  renderAll();
}

  const setZoom = v => { State.pixelsPerSec = v; renderTimeline(); setPlayhead(State.playhead); };
  $('scaleRange').oninput = e => setZoom(parseInt(e.target.value));
  $('zoomRange').oninput = e => { $('scaleRange').value = e.target.value; setZoom(parseInt(e.target.value)); };

  $('tlScroll').addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const newVal = clamp(State.pixelsPerSec + (e.deltaY < 0 ? 10 : -10), 20, 300);
      $('scaleRange').value = newVal;
      setZoom(newVal);
    }
  }, { passive: false });

  bindInspector();
  bindTitleModal();

  $('sfxStopAll').onclick = () => { SFXPlayer.stopAll(); toast('Стоп'); };

  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select')) return;
    if ($('thumbnailModal').classList.contains('show')) return;
    if (!$('app').classList.contains('active')) return;

    if (e.code === 'Space') { e.preventDefault(); State.playing ? pause() : play(); }
    else if (e.key === 'ArrowLeft') seekTo(State.playhead - 1 / State.fps);
    else if (e.key === 'ArrowRight') seekTo(State.playhead + 1 / State.fps);
    else if (e.key === 's' || e.key === 'S') $('btnSplit').click();
    else if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
    else if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
      e.preventDefault();
      State.selectedIds = State.clips.map(c => c.id);
      State.selectedId = State.selectedIds[0] || null;
      renderTimeline();
      updateInspector();
    }
    else if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); duplicateSelected(); }
    else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveProject(); }
    else if (e.key === 'Escape') { State.selectedId = null; State.selectedIds = []; renderTimeline(); updateInspector(); }
  });

  window.addEventListener('beforeunload', e => {
    if (State.unsavedChanges && (State.clips.length > 0 || State.media.length > 0)) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  setInterval(async () => {
    if (State.unsavedChanges && State.currentProjectId && (State.clips.length > 0 || State.media.length > 0)) {
      await saveProject(true);
    }
  }, 15000);
}

/* ============ INIT ============ */
async function init() {
  canvas.width = State.projectW;
  canvas.height = State.projectH;
  buildPresets();
  buildFxCategories();
  buildTransitions();
  buildSfx();
  buildFontGrid();
  renderStickerCategories();
  Thumb.init();
  bindUI();
  try { await FS.restoreHandle(); } catch (e) {}
  if (FS._pendingHandle && !FS.dirHandle) $('restoreBanner').classList.add('show');
  await renderLauncherProjects();
  window.addEventListener('resize', () => {
    renderTimeline();
    updateTextOverlay();
    if (Thumb.selected) Thumb.updateSelFrame();
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
